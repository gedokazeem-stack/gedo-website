<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دولة التلاوة</title>
<style>
:root{
 --bg:#f5f7f2;--card:#fff;--ink:#18352d;
 --muted:#718078;--green:#123b31;--green2:#1c5948;
 --gold:#c9a34a;--line:#e4e9e2;--soft:#edf3ee;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--ink);
 font-family:Tahoma,Arial,sans-serif;line-height:1.8;
}
header{
 background:linear-gradient(135deg,#0d3028,#1d5847);
 color:white;padding:18px 14px 24px;
 border-radius:0 0 25px 25px;
}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:23px;font-weight:bold}
.credit{
 color:#f4dfaa;border:1px solid #d8bc75;
 border-radius:20px;padding:4px 9px;font-size:12px;
 white-space:nowrap;
}
.sub{font-size:13px;color:#d9e7df}
main{max-width:800px;margin:auto;padding:14px}
.panel{
 background:var(--card);border:1px solid var(--line);
 border-radius:17px;padding:16px;margin:13px 0;
 box-shadow:0 8px 24px #102c2410;
}
h2{font-size:20px;color:var(--green);margin:0 0 10px}
h3{font-size:17px;margin:8px 0}
button{
 border:0;border-radius:12px;padding:10px 14px;
 background:var(--green2);color:white;
 font:inherit;cursor:pointer;
}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:var(--soft);color:var(--green);border:1px solid var(--line)}
.gold{background:var(--gold);color:#18352d}
.tile{
 background:var(--card);color:var(--ink);
 border:1px solid var(--line);text-align:right;
 width:100%;padding:13px;
}
.tile strong{display:block}
.tile span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav{display:flex;gap:7px;overflow:auto;padding:5px 0 10px}
.nav button{white-space:nowrap}
input,select{
 width:100%;padding:11px;border:1px solid var(--line);
 border-radius:10px;background:var(--card);
 color:var(--ink);font:inherit;margin:6px 0 12px;
}
label{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.muted{font-size:13px;color:var(--muted)}
.notice{
 background:#fff8e8;border:1px solid #f0dfb8;
 color:#70551a;border-radius:12px;padding:11px;
 font-size:13px;margin:10px 0;
}
.verse{
 background:var(--card);border:1px solid var(--line);
 border-radius:14px;padding:15px;margin:12px 0;
}
.verseText{
 font-size:21px;line-height:2.2;text-align:justify;
 white-space:pre-wrap;
}
.verseNum{color:var(--gold);font-weight:bold;margin-left:7px}
.verseActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.verseActions button{font-size:12px;padding:7px 10px}
.readerTitle{text-align:center;color:var(--green)}
.big-number{text-align:center;font-size:40px;font-weight:bold}
.progress{height:9px;background:var(--soft);border-radius:20px;overflow:hidden;margin:10px 0}
.progress span{display:block;height:100%;background:var(--gold);width:0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
body.night{
 --bg:#101b18;--card:#192923;--ink:#e9f1eb;
 --muted:#a8b8ae;--green:#d7e9dc;--green2:#28614e;
 --line:#2c4037;--soft:#22372e;
}
body.night header{background:linear-gradient(135deg,#091c17,#173d30)}
@media(max-width:430px){
 .brand{font-size:19px}.credit{font-size:10px}
 .verseText{font-size:19px}
}
</style>
</head>
<body>

<header>
 <div class="top">
  <div>
   <div class="brand">دولة التلاوة</div>
   <div class="sub">القراءة والتأمل والتعلّم</div>
  </div>
  <div class="credit">Made by Gedo (Zlatan)</div>
 </div>
</header>

<main>
<section id="chooser" class="panel">
 <h2>أهلًا بك في دولة التلاوة</h2>
 <p class="muted">اختار القسم الذي تريد الدخول إليه</p>
 <div class="grid">
  <button class="tile" onclick="enter('muslim')">
   <strong>☪ القسم الإسلامي</strong>
   <span>القرآن والأذكار والتسبيح</span>
  </button>
  <button class="tile" onclick="enter('christian')">
   <strong>✝ القسم المسيحي</strong>
   <span>الكتاب المقدس والتأملات</span>
  </button>
 </div>
</section>

<section id="app" class="hidden">
 <section class="panel">
  <div class="between">
   <div>
    <h2 id="welcome"></h2>
    <div class="muted">أهلًا بك في قسمك</div>
   </div>
   <button class="secondary" onclick="toggleNight()">☾</button>
  </div>
  <button class="secondary" onclick="showChooser()">تغيير القسم</button>
 </section>
 <div id="nav" class="nav"></div>
 <div id="content"></div>
</section>
</main>

<footer>دولة التلاوة ©</footer>

<script>
const $=id=>document.getElementById(id);

let faith="muslim";
let tab="home";
let tasbih=0;
let quranSurahs=[];
let bibleBooks=[];
let currentReader=null;

const AR_BOOKS=[
"التكوين","الخروج","اللاويين","العدد","التثنية",
"يشوع","القضاة","راعوث","صموئيل الأول","صموئيل الثاني",
"الملوك الأول","الملوك الثاني","أخبار الأيام الأول",
"أخبار الأيام الثاني","عزرا","نحميا","أستير","أيوب",
"المزامير","الأمثال","الجامعة","نشيد الأنشاد","إشعياء",
"إرميا","مراثي إرميا","حزقيال","دانيال","هوشع","يوئيل",
"عاموس","عوبديا","يونان","ميخا","ناحوم","حبقوق",
"صفنيا","حجي","زكريا","ملاخي","متى","مرقس","لوقا",
"يوحنا","أعمال الرسل","رومية","كورنثوس الأولى",
"كورنثوس الثانية","غلاطية","أفسس","فيلبي","كولوسي",
"تسالونيكي الأولى","تسالونيكي الثانية","تيموثاوس الأولى",
"تيموثاوس الثانية","تيطس","فليمون","العبرانيين",
"يعقوب","بطرس الأولى","بطرس الثانية","يوحنا الأولى",
"يوحنا الثانية","يوحنا الثالثة","يهوذا","رؤيا يوحنا"
];

function getSaved(key,fallback){
 try{
  const value=localStorage.getItem(key);
  return value===null?fallback:JSON.parse(value);
 }catch(e){return fallback}
}

function save(key,value){
 try{localStorage.setItem(key,JSON.stringify(value))}
 catch(e){console.log("تعذر الحفظ",e)}
}

function enter(type){
 faith=type;
 tab="home";
 $("chooser").classList.add("hidden");
 $("app").classList.remove("hidden");
 $("welcome").textContent=type==="muslim"?"القسم الإسلامي":"القسم المسيحي";
 renderNav();
 render();
 if(type==="muslim")loadSurahList();
 else loadBibleBooks();
}

function showChooser(){
 $("app").classList.add("hidden");
 $("chooser").classList.remove("hidden");
}

function toggleNight(){
 document.body.classList.toggle("night");
 localStorage.setItem("night",document.body.classList.contains("night"));
}

if(localStorage.getItem("night")==="true"){
 document.body.classList.add("night");
}

function renderNav(){
 let items=faith==="muslim"
 ?[
  ["home","الرئيسية"],["reading","القرآن"],
  ["plan","خطة الختمة"],["tasbih","التسبيح"],
  ["adhkar","الأذكار"],["favorites","المفضلة"],["quiz","التقييم"]
 ]
 :[
  ["home","الرئيسية"],["reading","الكتاب المقدس"],
  ["plan","خطة القراءة"],["reflection","تأمل اليوم"],
  ["favorites","المفضلة"],["quiz","التقييم"]
 ];

 $("nav").innerHTML=items.map(([id,name])=>
  `<button class="${tab===id?'gold':'secondary'}"
   onclick="openTab('${id}')">${name}</button>`
 ).join("");
}

function panel(title,body){
 return `<section class="panel"><h2>${title}</h2>${body}</section>`;
}

function render(){
 renderNav();
 let c="";

 if(tab==="home"){
  let saved=getSaved("progress_"+faith,null);
  c=panel("مرحبًا بك",`
   <p>اختر الخدمة التي تريد استخدامها.</p>
   <div class="grid">
    <button class="tile" onclick="openTab('reading')">
     <strong>📖 القراءة</strong><span>افتح النصوص</span>
    </button>
    <button class="tile" onclick="openTab('plan')">
     <strong>🗓️ خطة القراءة</strong><span>تابع إنجازك</span>
    </button>
    ${faith==="muslim"?`
     <button class="tile" onclick="openTab('tasbih')">
      <strong>📿 التسبيح</strong><span>عداد التسبيح</span>
     </button>
     <button class="tile" onclick="openTab('adhkar')">
      <strong>🤲 الأذكار</strong><span>أذكار مختارة</span>
     </button>
    `:`
     <button class="tile" onclick="openTab('reflection')">
      <strong>🕊️ تأمل اليوم</strong><span>تأمل قصير</span>
     </button>
    `}
   </div>
   <div class="notice">
    ${saved?"آخر موضع محفوظ: "+escapeHTML(saved.label):"لم تحفظ موضع قراءة بعد."}
   </div>
   ${saved?'<button onclick="resumeReading()">متابعة القراءة</button>':''}
  `);

 }else if(tab==="reading"){
  c=panel(
   faith==="muslim"?"سور القرآن الكريم":"أسفار الكتاب المقدس",
   `<input id="bookSearch" placeholder="ابحث عن الاسم..." oninput="filterBooks()">
    <div id="bookList" class="grid">
     <p class="muted">جاري تحميل الفهرس...</p>
    </div>
    <div id="reader"></div>`
  );

 }else if(tab==="plan"){
  c=panel(
   faith==="muslim"?"خطة ختم القرآن":"خطة قراءة الكتاب المقدس",
   `<label>عدد الأيام</label>
    <input id="days" type="number" min="1" max="365" value="30">
    <button onclick="calculatePlan()">احسب خطتي</button>
    <div id="planResult" class="notice">اكتب عدد الأيام واضغط احسب.</div>
    <hr>
    <button onclick="completeDay()">أنجزت قراءة اليوم ✓</button>
    <p id="completed" class="muted"></p>`
  );
  updateDone();

 }else if(tab==="tasbih"){
  tasbih=Number(localStorage.getItem("tasbih_count")||0);
  c=panel("عداد التسبيح",`
   <div class="big-number" id="count">${tasbih}</div>
   <div class="row">
    <button class="gold" onclick="addTasbih()">سبّح +1</button>
    <button class="secondary" onclick="resetTasbih()">إعادة العداد</button>
   </div>`
  );

 }else if(tab==="adhkar"){
  c=panel("أذكار مختارة",`
   <div class="verse">سبحان الله</div>
   <div class="verse">الحمد لله</div>
   <div class="verse">لا إله إلا الله</div>
   <div class="verse">الله أكبر</div>
   <div class="verse">أستغفر الله</div>`
  );

 }else if(tab==="reflection"){
  c=panel("تأمل اليوم",`
   <h3>المحبة والرحمة</h3>
   <p>خصص لحظة اليوم للتفكير في المحبة والرحمة، واجعل كلماتك وأفعالك سببًا في تشجيع من حولك ومساندتهم.</p>`
  );

 }else if(tab==="favorites"){
  c=panel("المفضلة",`<div id="favoritesList"></div>`);
  setTimeout(renderFavorites,0);

 }else if(tab==="quiz"){
  c=panel("تقييم سريع",
   faith==="muslim"
   ?`<p>ما السورة التي تبدأ بها المصاحف؟</p>
     <div class="row">
      <button class="secondary" onclick="answerQuiz(false)">البقرة</button>
      <button class="secondary" onclick="answerQuiz(true)">الفاتحة</button>
      <button class="secondary" onclick="answerQuiz(false)">الإخلاص</button>
     </div><p id="answer"></p>`
   :`<p>ما القسمان الرئيسيان للكتاب المقدس؟</p>
     <div class="row">
      <button class="secondary" onclick="answerQuiz(true)">العهد القديم والعهد الجديد</button>
      <button class="secondary" onclick="answerQuiz(false)">المزامير والأمثال فقط</button>
     </div><p id="answer"></p>`
  );
 }

 $("content").innerHTML=c;
}

function openTab(id){
 tab=id;
 currentReader=null;
 render();
 if(id==="reading"){
  if(faith==="muslim")loadSurahList();
  else loadBibleBooks();
 }
}

async function loadSurahList(){
 const list=$("bookList");
 if(!list)return;

 quranSurahs=getSaved("cache_quran_surahs",[]);
 if(quranSurahs.length)displayBooks();

 try{
  const response=await fetch("https://api.alquran.cloud/v1/surah");
  if(!response.ok)throw new Error("Network error");
  const json=await response.json();
  if(json.code!==200)throw new Error("API error");
  quranSurahs=json.data;
  save("cache_quran_surahs",quranSurahs);
  displayBooks();
 }catch(error){
  if(!quranSurahs.length){
   list.innerHTML='<p class="notice">تعذر تحميل السور. اتصل بالإنترنت أول مرة لتحميل الفهرس.</p>';
  }
 }
}

async function loadBibleBooks(){
 const list=$("bookList");
 if(!list)return;

 bibleBooks=getSaved("cache_bible_books",[]);
 if(bibleBooks.length)displayBooks();

 try{
  const response=await fetch("https://api.biblesupersearch.com/api/books");
  if(!response.ok)throw new Error("Network error");
  const json=await response.json();
  if(!json.results||!json.results.length)throw new Error("No books");

  bibleBooks=json.results.map(book=>({
   id:book.id,
   name:AR_BOOKS[book.id-1]||book.name,
   shortname:book.shortname,
   chapters:book.chapters
  }));

  save("cache_bible_books",bibleBooks);
  displayBooks();
 }catch(error){
  if(!bibleBooks.length){
   list.innerHTML='<p class="notice">تعذر تحميل الأسفار. اتصل بالإنترنت لتحميل الفهرس.</p>';
  }
 }
}

function displayBooks(){
 const list=$("bookList");
 if(!list)return;

 const search=$("bookSearch")?.value||"";
 let books=faith==="muslim"?quranSurahs:bibleBooks;

 list.innerHTML=books.filter(book=>{
  let name=typeof book==="string"?book:book.name;
  return name.includes(search);
 }).map(book=>{
  if(faith==="muslim"){
   return `<button class="tile" onclick="openSurah(${book.number})">
    <strong>${escapeHTML(book.name)}</strong>
    <span>${book.numberOfAyahs} آية</span>
   </button>`;
  }

  return `<button class="tile" onclick="chooseBibleBook(${book.id})">
   <strong>${escapeHTML(book.name)}</strong>
   <span>${book.chapters} إصحاح</span>
  </button>`;
 }).join("")||'<p class="muted">لا توجد نتائج.</p>';
}

function filterBooks(){displayBooks()}

async function openSurah(number){
 const reader=$("reader");
 if(!reader)return;

 reader.innerHTML='<div class="panel">جاري تحميل السورة...</div>';

 let data=getSaved("cache_quran_surah_"+number,null);

 try{
  const response=await fetch(
   `https://api.alquran.cloud/v1/surah/${number}/quran-uthmani`
  );
  if(!response.ok)throw new Error("Network error");
  const json=await response.json();
  if(json.code!==200)throw new Error("API error");
  data=json.data;
  save("cache_quran_surah_"+number,data);
 }catch(error){
  if(!data){
   reader.innerHTML='<div class="notice">لم يتم تحميل هذه السورة من قبل. اتصل بالإنترنت وافتحها أول مرة.</div>';
   return;
  }
 }

 currentReader={
  type:"quran",
  number,
  name:data.name,
  ayahs:data.ayahs
 };

 let saved=getSaved("progress_muslim",null);
 let last=saved&&saved.number===number?saved.ayah:0;

 let verses=data.ayahs.map(ayah=>`
  <article class="verse" id="verse-${ayah.numberInSurah}">
   <div class="verseText">
    <span class="verseNum">${ayah.numberInSurah}.</span>
    ${escapeHTML(ayah.text)}
   </div>
   <div class="verseActions">
    <button onclick="saveQuranPosition(${number},${ayah.numberInSurah},'${escapeHTML(data.name)}')">حفظ موضعي</button>
    <button class="secondary" onclick="addFavorite('quran','${number}:${ayah.numberInSurah}','${escapeHTML(data.name)} - آية ${ayah.numberInSurah}','${escapeHTML(ayah.text)}')">☆ المفضلة</button>
    <button class="gold" onclick="startRecitationTest(${ayah.numberInSurah})">🎙️ اختبر تلاوتك</button>
   </div>
   <div id="recitation-${ayah.numberInSurah}"></div>
  </article>
 `).join("");

 reader.innerHTML=`
  <section class="panel">
   <h2 class="readerTitle">${escapeHTML(data.name)}</h2>
   <p class="muted" style="text-align:center">${data.ayahs.length} آية</p>
   ${last?`<button class="gold" onclick="scrollToVerse(${last})">اذهب لآخر موضع محفوظ</button>`:""}
   ${verses}
  </section>`;
}

function scrollToVerse(number){
 document.getElementById("verse-"+number)?.scrollIntoView({behavior:"smooth"});
}

function saveQuranPosition(number,ayah,name){
 save("progress_muslim",{
  number,ayah,label:name+" - الآية "+ayah
 });
 alert("تم حفظ موضع القراءة");
}

/* اختبار التلاوة ومقارنة الكلمات */

function normalizeArabic(text){
 return String(text)
  .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,"")
  .replace(/[أإآٱ]/g,"ا")
  .replace(/ى/g,"ي")
  .replace(/ؤ/g,"و")
  .replace(/ئ/g,"ي")
  .replace(/ـ/g,"")
  .replace(/[^\u0621-\u064A\s]/g," ")
  .replace(/\s+/g," ")
  .trim();
}

function compareRecitation(expectedText,spokenText){
 const a=normalizeArabic(expectedText).split(" ").filter(Boolean);
 const b=normalizeArabic(spokenText).split(" ").filter(Boolean);

 const m=a.length,n=b.length;
 const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));

 for(let i=0;i<=m;i++)dp[i][0]=i;
 for(let j=0;j<=n;j++)dp[0][j]=j;

 for(let i=1;i<=m;i++){
  for(let j=1;j<=n;j++){
   dp[i][j]=Math.min(
    dp[i-1][j]+1,
    dp[i][j-1]+1,
    dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)
   );
  }
 }

 let i=m,j=n,correct=0,details=[];

 while(i>0||j>0){
  if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){
   if(a[i-1]===b[j-1]){
    details.unshift("✅ "+escapeHTML(a[i-1]));
    correct++;
   }else{
    details.unshift("❌ قلت: "+escapeHTML(b[j-1])+" — الصحيح: "+escapeHTML(a[i-1]));
   }
   i--;j--;
  }else if(i>0&&dp[i][j]===dp[i-1][j]+1){
   details.unshift("⚠️ كلمة ناقصة: "+escapeHTML(a[i-1]));
   i--;
  }else{
   details.unshift("➕ كلمة زائدة أو مكررة: "+escapeHTML(b[j-1]));
   j--;
  }
 }

 return {
  score:a.length?Math.round(correct/a.length*100):0,
  details
 };
}

async function startRecitationTest(ayahNumber){
 const box=$("recitation-"+ayahNumber);
 const ayah=currentReader?.ayahs?.find(x=>x.numberInSurah===ayahNumber);

 if(!box||!ayah)return;

 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!SR){
  box.innerHTML='<div class="notice">المتصفح لا يدعم التعرف على الصوت. جرّب متصفحًا آخر.</div>';
  return;
 }

 box.innerHTML='<div class="notice">جاري التحقق من دعم التعرف الصوتي المحلي...</div>';

 if(typeof SR.available==="function"&&typeof SR.install==="function"){
  try{
   const status=await SR.available({
    langs:["ar-SA"],
    processLocally:true,
    quality:"dictation"
   });

   if(status==="available"){
    launchRecognition(SR,ayahNumber,true);
    return;
   }

   if(status==="downloadable"||status==="downloading"){
    box.innerHTML=`
     <div class="notice">
      حزمة اللغة العربية المحلية غير مثبتة.
      اضغط لتنزيلها أول مرة، وقد تحتاج اتصالًا بالإنترنت.
     </div>
     <button class="gold" onclick="installArabicPack(${ayahNumber})">تنزيل حزمة العربية</button>`;
    return;
   }

   showOnlineChoice(ayahNumber);
   return;

  }catch(error){
   showOnlineChoice(ayahNumber);
   return;
  }
 }

 showOnlineChoice(ayahNumber);
}

async function installArabicPack(ayahNumber){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 const box=$("recitation-"+ayahNumber);

 if(!SR||typeof SR.install!=="function"){
  showOnlineChoice(ayahNumber);
  return;
 }

 box.innerHTML='<div class="notice">جاري محاولة تنزيل حزمة اللغة العربية...</div>';

 try{
  const installed=await SR.install({
   langs:["ar-SA"],
   quality:"dictation"
  });

  if(installed){
   box.innerHTML=`
    <div class="notice">تم تثبيت الحزمة. اضغط الآن لبدء الاختبار.</div>
    <button class="gold" onclick="startRecitationTest(${ayahNumber})">ابدأ الاختبار</button>`;
  }else{
   box.innerHTML='<div class="notice">لم نتمكن من تثبيت الحزمة. قد لا يدعم المتصفح العربية محليًا.</div>';
  }
 }catch(error){
  box.innerHTML='<div class="notice">تعذر تنزيل الحزمة. تأكد من اتصال الإنترنت ودعم المتصفح.</div>';
 }
}

function showOnlineChoice(ayahNumber){
 const box=$("recitation-"+ayahNumber);
 box.innerHTML=`
  <div class="notice">
   التعرف الصوتي العربي المحلي غير متاح في هذا المتصفح.
   يمكنك تجربة الاختبار عبر الإنترنت، وقد يُرسل الصوت إلى خدمة التعرف الصوتي.
  </div>
  <button class="secondary" onclick="startOnlineRecitation(${ayahNumber})">اختبار عبر الإنترنت</button>`;
}

function startOnlineRecitation(ayahNumber){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 launchRecognition(SR,ayahNumber,false);
}

function launchRecognition(SR,ayahNumber,local){
 const box=$("recitation-"+ayahNumber);
 const ayah=currentReader?.ayahs?.find(x=>x.numberInSurah===ayahNumber);

 if(!box||!ayah)return;

 try{
  const recognition=new SR();
  recognition.lang="ar-SA";
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.maxAlternatives=1;

  if(local)recognition.processLocally=true;

  box.innerHTML='<div class="notice">🎙️ جاري الاستماع... اقرأ الآية بوضوح.</div>';

  recognition.onresult=function(event){
   const spoken=event.results[0][0].transcript;
   const result=compareRecitation(ayah.text,spoken);

   box.innerHTML=`
    <div class="verse">
     <h3>نتيجة اختبار الآية ${ayahNumber}</h3>
     <div class="big-number">${result.score}%</div>
     <p><strong>الذي سمعه التطبيق:</strong></p>
     <p>${escapeHTML(spoken)}</p>
     <hr>
     ${result.details.map(x=>"<p>"+x+"</p>").join("")}
     <p class="muted">النتيجة تقريبية؛ قد يخطئ التعرف الصوتي في بعض الكلمات.</p>
     <button class="secondary" onclick="startRecitationTest(${ayahNumber})">إعادة الاختبار</button>
    </div>`;
  };

  recognition.onerror=function(){
   box.innerHTML='<div class="notice">لم نتمكن من سماع القراءة. تأكد من السماح باستخدام الميكروفون وحاول مرة أخرى.</div>';
  };

  recognition.onend=function(){};
  recognition.start();

 }catch(error){
  box.innerHTML='<div class="notice">تعذر بدء التسجيل. حاول مرة أخرى.</div>';
 }
}

/* الكتاب المقدس */

async function chooseBibleBook(id){
 const book=bibleBooks.find(x=>x.id===id);
 if(!book)return;

 const reader=$("reader");
 if(!reader)return;

 let options="";
 for(let i=1;i<=book.chapters;i++){
  options+=`<option value="${i}">الإصحاح ${i}</option>`;
 }

 reader.innerHTML=`
  <section class="panel">
   <h2>${escapeHTML(book.name)}</h2>
   <label>اختر الإصحاح</label>
   <select id="chapterSelect">${options}</select>
   <button onclick="openBibleChapter(${id})">افتح الإصحاح</button>
   <div id="bibleText"></div>
  </section>`;

 let saved=getSaved("progress_christian",null);
 if(saved&&saved.bookId===id){
  $("chapterSelect").value=saved.chapter;
  openBibleChapter(id);
 }
}

async function openBibleChapter(bookId){
 const book=bibleBooks.find(x=>x.id===bookId);
 const chapter=Number($("chapterSelect").value);
 const output=$("bibleText");

 if(!book||!output)return;

 output.innerHTML='<p class="muted">جاري تحميل الإصحاح...</p>';

 const cacheKey="cache_bible_"+bookId+"_"+chapter;
 let verses=getSaved(cacheKey,null);

 try{
  const reference=book.shortname+" "+chapter;
  const url="https://api.biblesupersearch.com/api?"+
   new URLSearchParams({
    bible:"svd",
    reference:reference,
    data_format:"minimal",
    page_all:"true"
   });

  const response=await fetch(url);
  if(!response.ok)throw new Error("Network error");

  const json=await response.json();
  if(json.errors&&json.errors.length)throw new Error("API error");

  const fresh=json.results&&json.results.svd;
  if(!fresh||!fresh.length)throw new Error("No verses");

  verses=fresh;
  save(cacheKey,verses);

 }catch(error){
  if(!verses){
   output.innerHTML='<div class="notice">لم يتم تحميل هذا الإصحاح من قبل. اتصل بالإنترنت وافتحه أول مرة.</div>';
   return;
  }
 }

 currentReader={type:"bible",bookId,chapter};

 let saved=getSaved("progress_christian",null);
 let last=saved&&saved.bookId===bookId&&saved.chapter===chapter?saved.verse:0;

 output.innerHTML=`
  <h3 class="readerTitle">${escapeHTML(book.name)} - الإصحاح ${chapter}</h3>
  ${last?`<button class="gold" onclick="scrollToVerse(${last})">اذهب لآخر موضع محفوظ</button>`:""}
  ${verses.map(v=>`
   <article class="verse" id="verse-${v.verse}">
    <div class="verseText">
     <span class="verseNum">${v.verse}.</span>
     ${escapeHTML(v.text)}
    </div>
    <div class="verseActions">
     <button onclick="saveBiblePosition(${bookId},${chapter},${v.verse},'${escapeHTML(book.name)}')">حفظ موضعي</button>
     <button class="secondary" onclick="addFavorite('bible','${bookId}:${chapter}:${v.verse}','${escapeHTML(book.name)} ${chapter}:${v.verse}','${escapeHTML(v.text)}')">☆ المفضلة</button>
    </div>
   </article>
  `).join("")}
 `;
}

function saveBiblePosition(bookId,chapter,verse,name){
 save("progress_christian",{
  bookId,chapter,verse,
  label:name+" - الإصحاح "+chapter+" - الآية "+verse
 });
 alert("تم حفظ موضع القراءة");
}

function resumeReading(){
 let saved=getSaved("progress_"+faith,null);
 if(!saved)return;

 openTab("reading");

 setTimeout(()=>{
  if(faith==="muslim"){
   openSurah(saved.number).then(()=>{
    setTimeout(()=>scrollToVerse(saved.ayah),500);
   });
  }else{
   chooseBibleBook(saved.bookId);
   setTimeout(()=>{
    if($("chapterSelect")){
     $("chapterSelect").value=saved.chapter;
     openBibleChapter(saved.bookId).then(()=>{
      setTimeout(()=>scrollToVerse(saved.verse),500);
     });
    }
   },500);
  }
 },500);
}

/* المفضلة */

function addFavorite(type,id,label,text){
 let key="favorites_"+faith;
 let items=getSaved(key,[]);

 if(items.some(x=>x.id===id&&x.type===type)){
  alert("موجودة بالفعل في المفضلة");
  return;
 }

 items.push({type,id,label,text});
 save(key,items);
 alert("تمت الإضافة إلى المفضلة");
}

function renderFavorites(){
 const box=$("favoritesList");
 if(!box)return;

 let items=getSaved("favorites_"+faith,[]);

 if(!items.length){
  box.innerHTML='<p class="muted">لم تضف أي آيات إلى المفضلة بعد.</p>';
  return;
 }

 box.innerHTML=items.map((item,index)=>`
  <div class="verse">
   <strong>${escapeHTML(item.label)}</strong>
   <p>${escapeHTML(item.text)}</p>
   <button class="secondary" onclick="removeFavorite(${index})">حذف من المفضلة</button>
  </div>
 `).join("");
}

function removeFavorite(index){
 let key="favorites_"+faith;
 let items=getSaved(key,[]);
 items.splice(index,1);
 save(key,items);
 renderFavorites();
}

/* الخطط والعداد والتقييم */

function calculatePlan(){
 const days=Math.max(1,Math.min(365,Number($("days").value)||1));

 $("planResult").textContent=faith==="muslim"
  ?`لختم القرآن في ${days} يومًا، اقرأ حوالي ${Math.ceil(604/days)} صفحة يوميًا.`
  :`قسّم قراءتك على ${days} يومًا، واختر عددًا مناسبًا من الإصحاحات يوميًا.`;
}

function completeDay(){
 let key="days_"+faith;
 let count=Number(localStorage.getItem(key)||0)+1;
 localStorage.setItem(key,count);
 updateDone();
}

function updateDone(){
 let el=$("completed");
 if(el)el.textContent="أيام القراءة المكتملة: "+Number(localStorage.getItem("days_"+faith)||0);
}

function addTasbih(){
 tasbih++;
 localStorage.setItem("tasbih_count",tasbih);
 $("count").textContent=tasbih;
}

function resetTasbih(){
 tasbih=0;
 localStorage.setItem("tasbih_count",0);
 $("count").textContent=0;
}

function answerQuiz(correct){
 $("answer").textContent=correct?"إجابة صحيحة، أحسنت!":"حاول مرة أخرى.";
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,function(char){
  return {
   "&":"&amp;","<":"&lt;",">":"&gt;",
   '"':"&quot;","'":"&#039;"
  }[char];
 });
}
