<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gedo Code Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&family=Reem+Kufi:wght@600;700&display=swap">
<style>
/* concept: كراسة رسم بياني للطالب. ورق مربعات، حدود حبر سميكة، ظلال صلبة، ماركر أصفر للتمييز */
:root{
  --paper:#F2F5FB; --ink:#14213D; --mute:#55658A; --line:#D3DDF0; --card:#FFFFFF; --edge:#14213D;
  --acc:#2B4BFF; --acc-ink:#FFFFFF; --hl:#FFE14D; --hl-ink:#14213D;
  --ok:#0B7F58; --okbg:#DDF5EA; --bad:#C0283A; --badbg:#FDE4E7; --warn:#8A5A00; --warnbg:#FFF1CC;
  --code:#EDF1FF; --codeink:#14213D; --tk:#C2255C; --ts:#0B7A4B; --tn:#B45309; --tc:#7585A6;
  --display:'Reem Kufi','Cairo',system-ui,sans-serif; --body:'Cairo',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0B1330; --ink:#E8EDFF; --mute:#9DAAD0; --line:#1B2A58; --card:#111B40; --edge:#4A5EA8;
  --acc:#8BA5FF; --acc-ink:#0B1330; --hl:#FFD93D; --hl-ink:#14213D;
  --ok:#4ADE9A; --okbg:#0F3A2C; --bad:#FF8A95; --badbg:#3F1822; --warn:#FFD27A; --warnbg:#3A2C0C;
  --code:#0A1127; --codeink:#DCE5FF; --tk:#FF8FB3; --ts:#7EE6B0; --tn:#FFC36B; --tc:#7585B0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B1330; --ink:#E8EDFF; --mute:#9DAAD0; --line:#1B2A58; --card:#111B40; --edge:#4A5EA8;
  --acc:#8BA5FF; --acc-ink:#0B1330; --hl:#FFD93D; --hl-ink:#14213D;
  --ok:#4ADE9A; --okbg:#0F3A2C; --bad:#FF8A95; --badbg:#3F1822; --warn:#FFD27A; --warnbg:#3A2C0C;
  --code:#0A1127; --codeink:#DCE5FF; --tk:#FF8FB3; --ts:#7EE6B0; --tn:#FFC36B; --tc:#7585B0; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--paper);color:var(--ink);font:16px/1.85 var(--body);direction:rtl;
  background-image:linear-gradient(color-mix(in srgb,var(--line) 70%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 70%,transparent) 1px,transparent 1px);background-size:28px 28px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:2px solid var(--edge)}
.top .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px}
.brand{font:700 24px/1 var(--display);display:flex;align-items:center;gap:8px;margin-inline-end:auto}
.brand i{font:600 18px var(--mono);font-style:normal;background:var(--acc);color:var(--acc-ink);padding:3px 7px;border-radius:5px;direction:ltr}
.by{direction:ltr;font:800 14px/1 var(--body);background:var(--hl);color:var(--hl-ink);border:2px solid #14213D;border-radius:999px;padding:7px 14px;box-shadow:2px 2px 0 #14213D;white-space:nowrap}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.lang{font:700 13px var(--mono);direction:ltr;border:2px solid var(--edge);border-radius:6px;padding:3px 10px;background:var(--card);color:var(--ink)}
.lang.on{background:var(--acc);color:var(--acc-ink)}
.lang.soon{opacity:.5;border-style:dashed}
.btn{font:700 15px var(--body);border:2px solid var(--edge);background:var(--card);color:var(--ink);padding:5px 14px;border-radius:6px;cursor:pointer;box-shadow:2px 2px 0 var(--edge)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.sm{font-size:13px;padding:2px 10px}
.views{display:flex;gap:8px;overflow-x:auto;padding-block:14px 6px}
.views a{flex:none;text-decoration:none;color:var(--ink);font:700 16px var(--display);padding:6px 16px;border:2px solid var(--edge);border-radius:6px;background:var(--card)}
.views a.on{background:var(--hl);color:var(--hl-ink);box-shadow:3px 3px 0 var(--edge)}

main{padding-block:14px 40px;min-height:70vh}
h1,h2,h3{font-family:var(--display);line-height:1.35;text-wrap:balance;margin:0 0 .4em}
h1{font-size:clamp(28px,5vw,42px)}
h2{font-size:24px}
h3{font-size:19px}
.mk{background:linear-gradient(transparent 58%,var(--hl) 58%);padding-inline:4px}
.card{background:var(--card);border:2px solid var(--edge);border-radius:8px;box-shadow:4px 4px 0 var(--edge);padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.hero{padding-block:18px 8px;max-width:720px}
.hero p{font-size:18px;color:var(--mute);margin:0}
.lcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);min-width:0}
.lcard:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--edge)}
.lcard .num{font:700 34px/1 var(--mono);color:var(--acc);direction:ltr;text-align:right}
.lcard small{color:var(--mute);direction:ltr;text-align:right;font-family:var(--mono)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.pill{font:700 12px var(--body);border:2px solid var(--edge);border-radius:999px;padding:0 10px}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:4px 12px}
.tabs button{flex:none;font:700 15px var(--body);border:2px solid var(--edge);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 14px;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--acc-ink)}
.crumb{font:600 14px var(--mono);color:var(--mute);direction:ltr;text-align:right}
.analogy{background:var(--warnbg);color:var(--ink);border:2px dashed var(--warn);border-radius:8px;padding:12px 16px}
.part{min-width:0}
.part p{margin:.2em 0 .8em}
pre.code{direction:ltr;text-align:left;background:var(--code);color:var(--codeink);border:2px solid var(--edge);border-radius:6px;padding:12px 14px;overflow-x:auto;font:13.5px/1.7 var(--mono);margin:0;tab-size:2}
.t-c{color:var(--tc);font-style:italic}.t-s{color:var(--ts)}.t-k{color:var(--tk);font-weight:600}.t-n{color:var(--tn)}
.cb{min-width:0;display:flex;flex-direction:column;gap:6px;margin:8px 0}
.cb .bar{display:flex;gap:8px;align-items:center}
.cb .bar span{margin-inline-end:auto;font:600 12px var(--mono);color:var(--mute)}
.out{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;background:#0A1127;color:#B9F5D0;border-radius:6px;padding:10px 12px;font:13px/1.6 var(--mono);margin:0;border:2px solid var(--edge)}
.out .e{color:#FF9AA5}
.frame{width:100%;border:2px solid var(--edge);border-radius:6px;background:#fff}
.bad,.good{border-radius:6px;padding:2px 8px;font:700 13px var(--body);display:inline-block}
.bad{background:var(--badbg);color:var(--bad)}.good{background:var(--okbg);color:var(--ok)}
.mis .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

.editor{border:2px solid var(--edge);border-radius:8px;background:var(--card);box-shadow:4px 4px 0 var(--edge);overflow:hidden}
.ed-head{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:2px solid var(--edge);background:var(--hl);color:var(--hl-ink)}
.ed-head b{margin-inline-end:auto}
.ed-head .mode{font:700 12px var(--mono);border:2px solid #14213D;border-radius:5px;padding:0 6px}
.editor textarea{display:block;width:100%;min-height:210px;resize:vertical;direction:ltr;text-align:left;border:0;outline:0;background:var(--code);color:var(--codeink);font:14px/1.7 var(--mono);padding:12px 14px;tab-size:2}
.ed-btns{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:2px solid var(--edge)}
.ed-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.task{padding:12px 14px;border-bottom:2px dashed var(--edge)}
.verdict{border:2px solid var(--edge);border-radius:8px;padding:10px 14px}
.verdict.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.verdict.no{background:var(--badbg);border-color:var(--bad);color:var(--ink)}
.verdict h3{margin:0 0 4px}
.verdict ul{margin:4px 0 0;padding-inline-start:20px}
.note{background:var(--warnbg);border:2px dashed var(--warn);border-radius:8px;padding:8px 12px}

.q{padding:14px 16px;min-width:0}
.q .qt{font-weight:700;margin-bottom:6px}
.q label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer}
.q textarea{width:100%;min-height:90px;font:15px/1.7 var(--body);background:var(--paper);color:var(--ink);border:2px solid var(--edge);border-radius:6px;padding:8px 10px;resize:vertical}
.q.ok{border-color:var(--ok);background:var(--okbg)}.q.no{border-color:var(--bad);background:var(--badbg)}
.q .why{margin-top:6px;font-size:15px}
.score{font:700 40px var(--display)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
details.proj{padding:0}
details.proj>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;gap:12px;align-items:center}
details.proj>summary::-webkit-details-marker{display:none}
details.proj>summary .n{font:700 26px var(--mono);color:var(--acc);direction:ltr}
details.proj>summary b{font:700 19px var(--display);margin-inline-end:auto}
details.proj .inner{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
details.proj ol,.sumlist{margin:0;padding-inline-start:22px}
.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
footer{border-top:2px solid var(--edge);background:var(--card);padding-block:18px;text-align:center;font-weight:700}
footer .by{display:inline-block}
@media (max-width:560px){.top .row{gap:8px}.brand{font-size:20px}.by{font-size:12px;padding:6px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="row">
    <div class="brand"><i>&lt;/&gt;</i><span>Gedo Code Academy</span></div>
    <span class="by">Made By Gedo</span>
    <button class="btn sm" id="themeBtn" type="button" aria-label="تبديل الوضع الليلي">الوضع الليلي</button>
  </div>
  <div class="langs" style="padding-bottom:6px">
    <span class="lang on">JavaScript</span>
    <span class="lang soon" title="قريبًا">HTML · قريبًا</span>
    <span class="lang soon" title="قريبًا">CSS · قريبًا</span>
    <span class="lang soon" title="قريبًا">Python · قريبًا</span>
  </div>
</div></header>
<div class="wrap">
  <nav class="views" id="views" aria-label="الأقسام"></nav>
  <main id="main"></main>
</div>
<footer><div class="wrap"><span class="by">Made By Gedo</span></div></footer>

<script>
const C=s=>s.replace(/§/g,'`').replace(/¤/g,'$');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e};
const store={get(){try{return JSON.parse(localStorage.getItem('gedo-progress')||'{}')}catch(e){return{}}},set(o){try{localStorage.setItem('gedo-progress',JSON.stringify(o))}catch(e){}}};
let prog=store.get();prog.ex=prog.ex||{};prog.quiz=prog.quiz||{};
const save=()=>store.set(prog);

/* ---------- تلوين الكود ---------- */
const HLRX=/(\/\/.*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|\b(const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|class|this|try|catch|finally|throw|async|await|true|false|null|undefined|typeof|of|in)\b|\b(\d+(?:\.\d+)?)\b/g;
function hl(code){let out='',last=0,m;HLRX.lastIndex=0;while((m=HLRX.exec(code))){out+=esc(code.slice(last,m.index));const c=m[1]?'c':m[2]?'s':m[3]?'k':'n';out+='<span class="t-'+c+'">'+esc(m[0])+'</span>';last=HLRX.lastIndex}return out+esc(code.slice(last))}

/* ---------- تشغيل JavaScript داخل Worker ---------- */
const PRE="const __p=(t,v)=>self.postMessage({t,v});const __f=(x,d=0)=>{if(typeof x==='string')return d?\"'\"+x+\"'\":x;if(typeof x==='function')return '[Function: '+(x.name||'anonymous')+']';if(x instanceof Promise)return 'Promise { <pending> }';if(x instanceof Error)return x.name+': '+x.message;if(Array.isArray(x))return d>2?'[Array]':(x.length?'[ '+x.map(y=>__f(y,d+1)).join(', ')+' ]':'[]');if(x&&typeof x==='object'){if(d>2)return '[Object]';const k=Object.keys(x);return k.length?'{ '+k.map(q=>q+': '+__f(x[q],d+1)).join(', ')+' }':'{}'}return String(x)};console.log=(...a)=>__p('l',a.map(x=>__f(x)).join(' '));console.info=console.log;console.warn=console.log;console.error=(...a)=>__p('l','خطأ: '+a.map(x=>__f(x)).join(' '));addEventListener('unhandledrejection',e=>{const r=e.reason;__p('e',r&&r.message?(r.name+': '+r.message):String(r))});\n";
function runJS(code,timeout=3500){
  return new Promise(resolve=>{
    const out=[];let err=null,synced=false,done=false,idle=null,w=null,cap=null;
    const finish=loop=>{if(done)return;done=true;clearTimeout(idle);clearTimeout(cap);try{w&&w.terminate()}catch(e){}resolve({out,err,loop})};
    const settle=()=>{clearTimeout(idle);idle=setTimeout(()=>finish(false),700)};
    try{
      const url=URL.createObjectURL(new Blob([PRE+code+"\n;__p('s')"],{type:'text/javascript'}));
      w=new Worker(url);
    }catch(e){err={msg:'Error: المتصفح منع تشغيل الكود هنا'};return finish(false)}
    w.onmessage=e=>{const{t,v}=e.data;if(t==='l')out.push(v);else if(t==='e'){err=err||{msg:v}}else if(t==='s'){synced=true}if(synced)settle()};
    w.onerror=e=>{e.preventDefault();err={msg:e.message||'Error',line:e.lineno?e.lineno-1:null};finish(false)};
    cap=setTimeout(()=>finish(!synced),timeout);
  });
}
function explainErr(msg){
  const m=String(msg||'');
  if(/is not defined/.test(m)){const n=(m.match(/(\S+) is not defined/)||[])[1]||'';return 'ReferenceError: جافاسكريبت مش لاقية حاجة اسمها «'+esc(n)+'». غالبًا الاسم مكتوب غلط (الحروف الكبيرة والصغيرة بتفرق)، أو لسه ما عرّفتهاش، أو معرّفة جوه دالة أو بلوك تاني ومش شايفاها من هنا.'}
  if(/Assignment to constant/.test(m))return 'TypeError: حاولت تغيّر قيمة متغير معرّف بـ const. const معناها ثابت. لو القيمة هتتغير عرّفها بـ let.';
  if(/before initialization/.test(m))return 'ReferenceError: بتستخدم متغير (let أو const) قبل السطر اللي بيعرّفه. انقل التعريف فوق السطر اللي بيستخدمه.';
  if(/Cannot read propert/.test(m)){const p=(m.match(/reading '([^']+)'/)||[])[1];return 'TypeError: بتحاول تقرا الخاصية «'+esc(p||'')+'» من حاجة قيمتها undefined أو null. يعني الكائن أو العنصر مش موجود أصلًا. اطبعه قبل السطر ده وتأكد إنه اتعرّف، أو استخدم ?. للأمان.'}
  if(/is not a function/.test(m)){const n=(m.match(/(\S+) is not a function/)||[])[1]||'';return 'TypeError: «'+esc(n)+'» مش دالة وانت بتناديها بأقواس (). راجع الاسم، أو إن الحاجة دي فعلًا دالة وإنها اتعرّف صح.'}
  if(/already been declared/.test(m))return 'SyntaxError: عرّفت نفس المتغير بـ let أو const مرتين في نفس المكان. غيّر الاسم أو شيل التعريف المكرر.';
  if(/Maximum call stack/.test(m))return 'RangeError: الدالة بتنادي نفسها بلا نهاية (تكرار ذاتي من غير حالة توقف).';
  if(/Syntax|Unexpected|Invalid or unexpected|missing|expected/i.test(m))return 'SyntaxError: في خطأ في كتابة الكود نفسه. شوف: قوس أو أقواس ناقصة أو زيادة ) } ]، علامة تنصيص مش مقفولة، فاصلة في مكان غلط، أو كلمة مكتوبة غلط.';
  return 'حصل خطأ وقت التشغيل. اقرا رسالة الخطأ بالإنجليزي: غالبًا فيها اسم المشكلة والمكان.';
}
const normAr=s=>String(s).toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ');
function diffHint(got,exp){
  const g=got.split('\n'),e=exp.split('\n'),hs=[];
  if(g.length!==e.length)hs.push('عدد الأسطر اللي طبعتها '+g.length+' والمطلوب '+e.length+'.');
  for(let i=0;i<Math.max(g.length,e.length);i++){
    if(g[i]!==e[i]){
      hs.push('أول اختلاف في السطر '+(i+1)+': انت طبعت «'+esc(g[i]??'(لا شيء)')+'» والمطلوب «'+esc(e[i]??'(لا شيء)')+'».');
      const a=g[i],b=e[i];
      if(a!==undefined&&b!==undefined){
        if(a==='undefined')hs.push('ظهرت undefined: غالبًا نسيت return في الدالة، أو بتقرا خاصية مش موجودة.');
        else if(a==='NaN')hs.push('ظهرت NaN: عملية حسابية على نص أو قيمة مش رقم. حوّل القيمة لرقم الأول.');
        else if(a.trim()===b.trim())hs.push('الفرق في مسافات زيادة أو ناقصة.');
        else if(a.toLowerCase()===b.toLowerCase())hs.push('الفرق في الحروف الكبيرة والصغيرة.');
        else if(a!==''&&b!==''&&!isNaN(a)&&!isNaN(b))hs.push('الرقم مختلف: راجع المعادلة أو الشرط أو حدود الحلقة (< أو <=).');
        else if(/^\[|^\{/.test(a)&&!/^\[|^\{/.test(b))hs.push('طبعت مصفوفة أو كائن، والمطلوب قيمة واحدة.');
      }
      break;
    }
  }
  return hs;
}

/* ---------- عناصر الواجهة ---------- */
function copyText(text,pre){
  const fallback=()=>{const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText(text).catch(fallback)}catch(e){fallback()}
}
function htmlFrame(code,height){
  const f=document.createElement('iframe');f.className='frame';f.setAttribute('sandbox','allow-scripts allow-same-origin');f.style.height=(height||230)+'px';
  f.srcdoc='<meta charset="utf-8"><style>body{font-family:sans-serif;padding:12px;direction:rtl}</style><script>onerror=function(m){parent.postMessage({gerr:String(m)},"*")}<\/script>'+code;
  return f;
}
function codeBlock(code,{run='js',label=''}={}){
  const box=h('div','cb');
  const bar=h('div','bar');bar.append(h('span','',label||(run==='html'?'HTML':'JavaScript')));
  const pre=h('pre','code');pre.innerHTML=run==='html'?esc(code):hl(code);
  const cp=h('button','btn sm','نسخ');cp.type='button';cp.onclick=()=>{copyText(code,pre);cp.textContent='اتنسخ';setTimeout(()=>cp.textContent='نسخ',1200)};
  if(run){
    const go=h('button','btn sm pri','شغّل ▶');go.type='button';
    let area=null;
    go.onclick=async()=>{
      if(area)area.remove();
      if(run==='html'){area=h('div');const f=htmlFrame(code);area.append(f);const er=h('div','note','');er.hidden=true;area.append(er);
        const on=e=>{if(e.source===f.contentWindow&&e.data&&e.data.gerr){er.hidden=false;er.textContent='خطأ في الكود: '+e.data.gerr}};addEventListener('message',on);box.append(area);return}
      area=h('pre','out','...');box.append(area);
      const r=await runJS(code);
      let t=esc(r.out.join('\n'));
      if(r.err)t+=(t?'\n':'')+'<span class="e">'+esc(r.err.msg)+(r.err.line?' (سطر '+r.err.line+')':'')+'</span>';
      if(r.loop)t+=(t?'\n':'')+'<span class="e">الكود فضل شغال بلا نهاية فاتوقّف (حلقة لانهائية غالبًا)</span>';
      area.innerHTML=t||'(الكود اشتغل ومطبعش حاجة)';

}
function verdict(ok,title,items){

/* محرر مستقل: تمرين فيه تصحيح، أو محرر حر */
function Editor(o){
  const box=h('div','editor');
  const isHtml=o.mode==='html';
  box.append(h('div','ed-head','<b>'+esc(o.title||'المحرر')+'</b><span class="mode">'+(isHtml?'HTML + JS':'JavaScript')+'</span>'));
  if(o.task)box.append(h('div','task',o.task));
  const ta=h('textarea');ta.spellcheck=false;ta.value=o.starter||'';ta.setAttribute('aria-label','اكتب الكود هنا');
  ta.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart;ta.value=ta.value.slice(0,s)+'  '+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=s+2}});
  box.append(ta);
  const btns=h('div','ed-btns');
  const run=h('button','btn pri',o.expected!==undefined||o.test?'شغّل وصحّح ▶':'شغّل ▶');run.type='button';
  const reset=h('button','btn','إعادة');reset.type='button';
  btns.append(run,reset);
  let hintB=null,solB=null;
  if(o.hint){hintB=h('button','btn','تلميح');hintB.type='button';btns.append(hintB)}
  if(o.sol){solB=h('button','btn','الحل');solB.type='button';btns.append(solB)}
  box.append(btns);
  const body=h('div','ed-body');box.append(body);
  const clear=()=>{body.innerHTML=''};
  reset.onclick=()=>{ta.value=o.starter||'';clear()};
  if(hintB)hintB.onclick=()=>{body.prepend(h('div','note','💡 '+o.hint))};
  if(solB)solB.onclick=()=>{clear();body.append(h('div','note','الحل النموذجي (حاول بنفسك الأول):'));body.append(codeBlock(o.sol,{run:false,label:'حل'}))};
  run.onclick=async()=>{
    clear();const code=ta.value;
    if(isHtml){
      const f=htmlFrame(code,o.height||200);const er=h('div','note','');er.hidden=true;
      const on=e=>{if(e.source===f.contentWindow&&e.data&&e.data.gerr){er.hidden=false;er.textContent='خطأ في الكود: '+e.data.gerr}};addEventListener('message',on);
      body.append(f,er);
      if(o.test){
        f.onload=()=>setTimeout(()=>{
          let msg;try{msg=o.test(f.contentDocument)}catch(x){msg='حصل خطأ وقت الاختبار: '+x.message}
          if(!msg){body.append(verdict(true,'صح! الكود شغّال زي المطلوب',['اتأكدت إن الزرار بيشتغل لما اتضغط.']));if(o.id){prog.ex[o.id]=true;save();}}
          else body.append(verdict(false,'لسه مش صح',[msg]));
        },80);
      }
      return;
    }
    const res=await runJS(code+(o.after?'\n'+o.after:''));
    const outPre=h('pre','out');
    let t=esc(res.out.join('\n'));
    if(res.err)t+=(t?'\n':'')+'<span class="e">'+esc(res.err.msg)+'</span>';
    outPre.innerHTML=t||'(مفيش طباعة)';
    body.append(outPre);
    if(res.err){
      body.append(verdict(false,'الكود فيه خطأ'+(res.err.line?' (قريب من السطر '+res.err.line+')':''),[explainErr(res.err.msg)]));return}
    if(res.loop){body.append(verdict(false,'الكود فضل شغال بلا نهاية',['غالبًا عندك حلقة شرطها مش بيبقى false أبدًا. اتأكد إنك بتغيّر العدّاد جوه الحلقة (مثلًا i++) وإن الشرط ممكن يخلص.']));return}
    if(o.expected===undefined)return;
    const got=res.out.join('\n').trim(),exp=o.expected.trim();
    if(!got){body.append(verdict(false,'الكود اشتغل بس ما طبعش حاجة',['استخدم console.log(...) عشان تطبع النتيجة. الناتج المطلوب:<br><code>'+esc(exp)+'</code>']));return}
    if(got!==exp){
      const hs=diffHint(got,exp);
      body.append(verdict(false,'الناتج غلط',['المطلوب:<br><code>'+esc(exp).replace(/\n/g,'<br>')+'</code>','اللي طلع منك:<br><code>'+esc(got).replace(/\n/g,'<br>')+'</code>',...hs]));return}
    const miss=(o.need||[]).filter(([re])=>!re.test(code)).map(([,m])=>m);
    if(miss.length){body.append(verdict(false,'الناتج صح لكن طريقة الحل مش المطلوبة',miss));return}
    body.append(verdict(true,'صح! الناتج مظبوط والكود مطابق للمطلوب',['كمّل للدرس اللي بعده أو جرّب الامتحان.']));
    if(o.id){prog.ex[o.id]=true;save();}
  };
  return box;
}

/* ---------- الامتحان: 5 اختياري + 5 مقالي ---------- */
function Quiz(L){
  const box=h('div','stack');
  const qs=L.quiz;const total=qs.mcq.length+qs.es.length;
  const items=[];
  box.append(h('div','card','<h2>امتحان: '+esc(L.t)+'</h2><p style="margin:0">10 أسئلة: 5 اختياري و5 مقالي. المقالي بيتصحح بالكلمات المفتاحية للمفاهيم، وبعد التصحيح هتشوف الإجابة النموذجية.</p>'));
  qs.mcq.forEach((q,i)=>{
    const c=h('div','card q');c.innerHTML='<div class="qt">'+(i+1)+'. (اختياري) '+esc(q[0])+'</div>'+q[1].map((o,k)=>'<label><input type="radio" name="q'+L.id+'_'+i+'" value="'+k+'"><span style="direction:auto">'+esc(o)+'</span></label>').join('');
    box.append(c);items.push({kind:'m',c,q,i});
  });
  qs.es.forEach((q,i)=>{
    const c=h('div','card q');c.innerHTML='<div class="qt">'+(qs.mcq.length+i+1)+'. (مقالي) '+esc(q[0])+'</div><textarea aria-label="إجابة السؤال"></textarea>';
    box.append(c);items.push({kind:'e',c,q,i});
  });
  const res=h('div','card');res.hidden=true;
  const act=h('div','ed-btns');act.style.cssText='border:0;padding:0';
  const go=h('button','btn pri','صحّح الامتحان');go.type='button';const rs=h('button','btn','إعادة المحاولة');rs.type='button';
  act.append(go,rs);box.append(act,res);
  go.onclick=()=>{
    let score=0;
    items.forEach(it=>{
      it.c.classList.remove('ok','no');const old=it.c.querySelector('.why');if(old)old.remove();
      let ok=false,html='';
      if(it.kind==='m'){
        const sel=it.c.querySelector('input:checked');ok=!!sel&&+sel.value===it.q[2];
        html=(sel?'':'<b>ما اخترتش إجابة. </b>')+'الإجابة الصحيحة: <b>'+esc(it.q[1][it.q[2]])+'</b><br>'+esc(it.q[3]);
      }else{
        const ans=normAr(it.c.querySelector('textarea').value);
        const groups=it.q[1].map(g=>{const p=g.split('|');return{label:p[0],alts:(p.length>1?p.slice(1):[p[0]]).map(normAr)}});
        const hit=groups.filter(g=>g.alts.some(a=>a&&ans.includes(a)));
        const need=Math.ceil(groups.length*0.6);ok=hit.length>=need&&ans.length>8;
        const miss=groups.filter(g=>!hit.includes(g)).map(g=>g.label);
        html=(ok?'إجابتك غطّت المفاهيم المطلوبة.':'إجابتك ناقصها مفاهيم أساسية.')+(miss.length?' <b>ما ذكرتش:</b> '+miss.map(esc).join('، ')+'.':'')+'<br><b>إجابة نموذجية:</b> '+it.q[2];
      }
      if(ok)score++;
      it.c.classList.add(ok?'ok':'no');it.c.append(h('div','why',(ok?'✅ صح. ':'❌ غلط. ')+html));
    });
    prog.quiz[L.id]=Math.max(prog.quiz[L.id]||0,score);save();
    res.hidden=false;
    const pc=score/total;
    res.innerHTML='<div class="score">'+score+' / '+total+'</div><p style="margin:0">'+(pc>=.9?'ممتاز! انت متمكن من الدرس ده.':pc>=.7?'كويس جدًا. راجع الأسئلة الغلط وهتبقى 10 من 10.':pc>=.5?'مقبول. ارجع لتبويب الشرح والأخطاء الشائعة وجرّب تاني.':'محتاج مراجعة. اقرا الدرس تاني وجرّب التمرين وبعدين اعد الامتحان.')+'</p>';
    res.scrollIntoView({behavior:'smooth',block:'center'});
  };
  rs.onclick=()=>{items.forEach(it=>{it.c.classList.remove('ok','no');const w=it.c.querySelector('.why');if(w)w.remove();it.c.querySelectorAll('input').forEach(i=>i.checked=false);const t=it.c.querySelector('textarea');if(t)t.value=''});res.hidden=true;box.scrollIntoView({behavior:'smooth'})};
  return box;
}

const $=s=>document.querySelector(s);
function fixStrings(o){
  const f=s=>s.replace(/§/g,'`').replace(/¤/g,'$');
  if(Array.isArray(o)){o.forEach((v,i)=>{if(typeof v==='string')o[i]=f(v);else if(v&&typeof v==='object'&&!(v instanceof RegExp))fixStrings(v)})}
  else if(o&&typeof o==='object'){for(const k in o){const v=o[k];if(typeof v==='string')o[k]=f(v);else if(v&&typeof v==='object'&&!(v instanceof RegExp))fixStrings(v)}}
}

console.log("Hello".length);
console.log("a-b-c".split("-"));`},
{h:'تحويل الأنواع',p:`أحيانًا بنحتاج نحوّل نص لرقم أو العكس. الأدوات: <code>Number()</code> و<code>parseInt()</code> و<code>parseFloat()</code> و<code>String()</code>. لو التحويل فشل بتاخد <code>NaN</code> ومعناها «ليست رقمًا».`,c:`console.log(Number("42") + 8);
console.log(parseInt("12px"));
console.log(String(10) + 5);
console.log(Number("hello"));`}
],
mis:[
{h:'جمع رقم مع نص',p:`لما نستخدم <code>+</code> مع نص، جافاسكريبت بتعتبرها عملية «لصق» مش جمع. فـ <code>"5" + 3</code> بتطلع <code>"53"</code>. المشكلة بتظهر كتير لما تاخد قيمة من خانة إدخال (input) لأنها دايمًا بتيجي نص. الحل إنك تحوّل القيمة لرقم الأول بـ <code>Number()</code> قبل أي حساب. أما الطرح والضرب والقسمة فبتحوّل النص لرقم لوحدها، وده بيخلي الغلط مش واضح.`,bad:`const a = "5";
console.log(a + 3);
console.log(a - 3);`,good:`const a = "5";
console.log(Number(a) + 3);`},
{h:'الاعتماد على typeof مع null',p:`لو عايز تتأكد إن القيمة كائن بجد وجربت <code>typeof x === "object"</code> هتتفاجئ إن <code>null</code> كمان بتدي object. لازم تفحص null بشكل منفصل. وللمصفوفات استخدم <code>Array.isArray()</code> لأن typeof بترجع object لهم برضه.`,bad:`let user = null;
console.log(typeof user);
console.log(typeof []);`,good:`let user = null;
console.log(user === null);
console.log(Array.isArray([]));`},
{h:'مشكلة الأعداد العشرية',p:`الكمبيوتر بيخزّن الأرقام العشرية بصيغة ثنائية، فبعض القيم زي 0.1 مش بتتخزن بالظبط. النتيجة إن <code>0.1 + 0.2</code> مش بتساوي <code>0.3</code> بالظبط. دي مش غلطتك ولا غلطة جافاسكريبت وحدها، لغات كتير بتعمل كده. لما تعمل حسابات فلوس قرّب النتيجة بـ <code>toFixed(2)</code> أو اشتغل بالقروش كأرقام صحيحة.`,bad:`console.log(0.1 + 0.2);
console.log(0.1 + 0.2 === 0.3);`,good:`console.log((0.1 + 0.2).toFixed(2));
console.log(Math.abs(0.1 + 0.2 - 0.3) < 0.0001);`}
],
ex:{id:'e2',task:`<b>التمرين:</b> عندك <code>a = "10"</code> (نص) و<code>b = 5</code> (رقم). اطبع مجموعهم كرقم، يعني النتيجة <code>15</code>.`,starter:`const a = "10";
const b = 5;
// اطبع مجموعهم هنا
`,expected:'15',need:[[/Number\(|parseInt\(|parseFloat\(|\+\s*a\b/,'لازم تحوّل النص a لرقم الأول']],hint:`حوّل a لرقم بـ Number(a) وبعدين اجمع.`,sol:`const a = "10";
const b = 5;
console.log(Number(a) + b);`},
quiz:{mcq:[
['ناتج typeof "hello" هو؟',['string','text','char','word'],0,'النصوص نوعها string.'],
['ناتج "5" + 3 هو؟',['8','53','خطأ','NaN'],1,'مع النص + بتلصق، فالنتيجة نص "53".'],
['أيهم ليس من الأنواع الأساسية في جافاسكريبت؟',['number','boolean','string','integer'],3,'اللغة فيها number بس، مفيش نوع اسمه integer.'],
['ناتج typeof null هو؟',['null','undefined','object','number'],2,'خطأ تاريخي في اللغة بيرجع object.'],
['أنسب طريقة لدمج متغير جوه نص؟',['علامات تنصيص فقط','backtick مع ¤{ }','علامة # ','أقواس { } فقط'],1,'قالب النص: backtick وجواه ¤{اسم_المتغير}.']
],es:[
['اذكر أنواع البيانات الأساسية في جافاسكريبت مع مثال لكل نوع.',['string|نص|نصوص','number|رقم|ارقام','boolean|منطقي|true','null','undefined'],'string مثل "Ali"، number مثل 25، boolean مثل true، null للقيمة الفارغة بقصد، undefined للمتغير بلا قيمة.'],
['ما الفرق بين null و undefined؟',['null','undefined','قصد|عمدا|فارغ|فاضي','لم تحدد|معرف|ماتحطش|اتحطش|بدون قيمة'],'undefined يعني المتغير معرّف بلا قيمة، وnull قيمة فارغة بنحطها بقصد.'],
['ليه "5" + 3 بتدي "53"؟',['نص|string','دمج|لصق|concat|يلصق|ضم','تحويل|يحول|بيحول'],'لأن أحد الطرفين نص فبتحصل عملية دمج (لصق) والرقم بيتحوّل لنص.'],
['إزاي تحوّل نص لرقم؟',['number','parseint|parsefloat','نص|string'],'بنستخدم Number("42") أو parseInt أو parseFloat.'],
['إيه فايدة قوالب النصوص (template literals)؟',['متغير|متغيرات|دمج|ادخال','backtick|`|علامات','سطر|اسطر|اكثر من سطر|اسهل|اوضح'],'بتخلينا ندمج المتغيرات داخل النص بسهولة بـ ¤{ } وتدعم أكتر من سطر.']
]},
sum:['الأنواع الأساسية: string, number, boolean, null, undefined.','typeof بتعرّفك نوع القيمة (وtypeof null بترجع object).','"5" + 3 = "53" لأن + مع النص معناها لصق.','حوّل بـ Number() أو parseInt().','قوالب النصوص بعلامة backtick و ¤{متغير}.']},

{id:3,t:'العمليات والمقارنات',sub:'+ - * / % === && ||',lang:'js',
intro:`وانت بتحاسب في السوبرماركت بتعمل عمليات حساب (جمع وخصم) ومقارنات (هل معايا فلوس كفاية؟) وقرارات مركبة (لو معايا فلوس <b>و</b> العرض لسه شغال). العمليات في البرمجة هي نفس الحاجات دي.`,
parts:[
{h:'العمليات الحسابية',p:`الجمع <code>+</code> والطرح <code>-</code> والضرب <code>*</code> والقسمة <code>/</code>، والباقي <code>%</code> (مفيد جدًا لمعرفة العدد الزوجي)، والأُس <code>**</code>. وفي اختصارات زي <code>+=</code> و<code>++</code>.`,c:`console.log(7 + 3, 7 - 3, 7 * 3);
console.log(7 / 2);       // 3.5
console.log(7 % 2);       // باقي القسمة = 1
console.log(2 ** 3);      // 8
let n = 5;
n += 2;                   // n = n + 2
n++;                      // زيادة بواحد
console.log(n);`},
{h:'عوامل المقارنة',p:`بترجع <code>true</code> أو <code>false</code>: <code>></code> <code><</code> <code>>=</code> <code><=</code>. وللمساواة في عاملين: <code>==</code> (يساوي بعد تحويل النوع) و<code>===</code> (يساوي بالقيمة <b>والنوع</b>). استخدم <code>===</code> دايمًا.`,c:`console.log(10 > 5);
console.log("5" == 5);    // true (بيحوّل النوع)
console.log("5" === 5);   // false (النوع مختلف)
console.log(5 !== 6);`},
{h:'العوامل المنطقية',p:`<code>&&</code> معناها «و» (الاتنين لازم يتحققوا)، <code>||</code> معناها «أو» (واحد يكفي)، و<code>!</code> بتعكس القيمة. بنستخدمهم لما الشرط يكون مركب.`,c:`const age = 20, hasId = true;
console.log(age >= 18 && hasId);   // true
console.log(age < 18 || hasId);    // true
console.log(!hasId);               // false`},
{h:'العامل الثلاثي',p:`اختصار لـ if/else بسطر واحد: <code>شرط ? قيمة_لو_صح : قيمة_لو_غلط</code>.`,c:`const score = 72;
const result = score >= 50 ? "ناجح" : "راسب";
console.log(result);`}
],
mis:[
{h:'الخلط بين == و ===',p:`<code>==</code> بتحاول تحوّل الأنواع لبعض قبل المقارنة، فبتدي نتايج مش متوقعة: <code>0 == ""</code> و<code>"1" == 1</code> كلهم true. ده بيخبّي أخطاء في الكود. القاعدة البسيطة: استخدم <code>===</code> و<code>!==</code> في كل المقارنات وماتفكرش في الباقي.`,bad:`console.log(0 == "");
console.log("1" == 1);`,good:`console.log(0 === "");
console.log("1" === 1);`},
{h:'استخدام = بدل === في الشرط',p:`علامة <code>=</code> الواحدة معناها «خزّن»، مش «قارن». لو كتبت <code>if (x = 5)</code> انت بتحط 5 في x وبعدين بتسأل: هل 5 قيمة صحيحة؟ وده دايمًا true. فالشرط هيتنفذ مهما كانت قيمة x الأصلية. دقق في عدد علامات التساوي.`,bad:`let x = 3;
if (x = 5) { console.log("اتنفّذ رغم إن x كانت 3!"); }
console.log(x);`,good:`let x = 3;
if (x === 5) { console.log("اتنفّذ"); }
console.log(x);`},
{h:'توقع قسمة صحيحة',p:`في لغات تانية <code>7 / 2</code> بتدي 3. في جافاسكريبت كل الأرقام من نوع واحد فالنتيجة 3.5. لو محتاج الجزء الصحيح استخدم <code>Math.floor()</code>، ولو محتاج الباقي استخدم <code>%</code>.`,bad:`console.log(7 / 2);`,good:`console.log(Math.floor(7 / 2));
console.log(7 % 2);`}
],
ex:{id:'e3',task:`<b>التمرين:</b> عندك <code>n = 17</code>. اطبع في سطر أول هل n عدد زوجي (<code>true</code> أو <code>false</code>)، وفي سطر تاني باقي قسمة n على 5.`,starter:`const n = 17;
// اطبع السطرين هنا
`,expected:'false\n2',need:[[/%/,'لازم تستخدم عامل الباقي %']],hint:`n % 2 === 0 بتقولك هل زوجي. و n % 5 بتدي الباقي.`,sol:`const n = 17;
console.log(n % 2 === 0);
console.log(n % 5);`},
quiz:{mcq:[
['إيه ناتج 7 % 3 ؟',['2','1','3','0'],1,'7 ÷ 3 = 2 والباقي 1.'],
['إيه ناتج  "5" == 5 ؟',['true','false','خطأ','undefined'],0,'== بتحوّل النوع فبتساوي.'],
['إيه ناتج  "5" === 5 ؟',['true','false','خطأ','undefined'],1,'=== بتقارن النوع كمان، نص مقابل رقم.'],
['أي عامل يعني «و» المنطقي؟',['||','&&','!','??'],1,'&& معناها AND.'],
['إيه ناتج: 10 > 5 ? "yes" : "no" ؟',['yes','no','true','خطأ'],0,'الشرط صح فبيرجع القيمة الأولى.']
],es:[
['اشرح الفرق بين == و ===.',['==|يساوي','===|صارم|strict','النوع|type|تحويل|نوع'],'== بتحوّل الأنواع قبل المقارنة، و=== بتقارن القيمة والنوع بدون تحويل ولذلك هي الأفضل.'],
['اشرح العوامل المنطقية && و || و !.',['and|&&|و ','or|او','not|!|عكس|نفي'],'&& تتحقق لما الاتنين صح، || لما واحد على الأقل صح، و! بتعكس القيمة.'],
['إيه استخدام عامل الباقي % ؟ مع مثال.',['باقي|الباقي','قسمة|قسمه','زوجي|فردي|مثال'],'بيرجع باقي القسمة، ومنه نعرف الزوجي: n % 2 === 0.'],
['ما هو العامل الثلاثي (ternary)؟',['شرط|condition','?|ternary|ثلاثي','بديل|مختصر|if'],'اختصار لـ if/else في سطر: شرط ? لو_صح : لو_غلط.'],
['ما الفرق بين = و == ؟',['اسناد|تعيين|assign|تخزين|يخزن|بيحط|بتحط','مقارنة|يقارن|بتقارن|compare','=='],'= بتخزن قيمة في متغير، و== بتقارن بين قيمتين.']
]},
sum:['العمليات: + - * / % **.','قارن دايمًا بـ === و !==.','&& (و)، || (أو)، ! (عكس).','العامل الثلاثي: شرط ? أ : ب.','= للإسناد و === للمقارنة.']},

{id:4,t:'الشروط',sub:'if / else / switch',lang:'js',
intro:`إشارة المرور: لو الإشارة <b>حمرا</b> وقّف، وإلا لو <b>صفرا</b> استعد، وإلا اعدّي. الكود كمان بياخد قرارات حسب حالة معينة، وده اللي بنسميه الشروط.`,
parts:[
{h:'if و else if و else',p:`الكود جوه <code>if</code> بيتنفذ لو الشرط <code>true</code>. بنزوّد <code>else if</code> لشروط إضافية، و<code>else</code> للحالة الأخيرة. جافاسكريبت بتفحص من فوق لتحت وبتقف عند أول شرط يتحقق.`,c:`const temp = 32;
if (temp > 35) {
  console.log("حر شديد");
} else if (temp > 25) {
  console.log("جو دافئ");
} else {
  console.log("جو لطيف");
}`},
{h:'القيم truthy و falsy',p:`في الشرط أي قيمة بتتحول لـ true أو false. القيم الـ <b>falsy</b> هي: <code>false</code> و<code>0</code> و<code>""</code> (نص فاضي) و<code>null</code> و<code>undefined</code> و<code>NaN</code>. أي حاجة غيرها truthy حتى <code>"0"</code> و<code>[]</code>.`,c:`const values = [0, "", null, "hi", 5, [], undefined];
for (const v of values) {
  if (v) console.log(v, "→ truthy");
  else console.log(v, "→ falsy");
}`},
{h:'switch للحالات الكتير',p:`لما بتقارن متغير واحد بقيم كتير، <code>switch</code> أنضف من if كتير. كل <code>case</code> لازم ينتهي بـ <code>break</code> وإلا الكود هيكمل للحالة اللي بعده. <code>default</code> للحالة اللي مفيش فيها تطابق.`,c:`const day = 5;
switch (day) {
  case 5:
    console.log("الجمعة");
    break;
  case 6:
    console.log("السبت");
    break;
  default:
    console.log("يوم تاني");
}`}
],
mis:[
{h:'ترتيب else if غلط',p:`جافاسكريبت بتنفذ أول شرط صحيح وبتتجاهل الباقي. لو بدأت بالشرط الأوسع (درجة أكبر من 50) هو هيتحقق لأي درجة عالية ومش هتوصل للشروط الأدق. رتّب الشروط من الأدق للأعم: الأعلى قيمة الأول.`,bad:`const score = 95;
if (score >= 50) console.log("ناجح");
else if (score >= 90) console.log("ممتاز");`,good:`const score = 95;
if (score >= 90) console.log("ممتاز");
else if (score >= 50) console.log("ناجح");`},
{h:'نسيان break في switch',p:`من غير <code>break</code> بيحصل «السقوط» (fall-through): بعد ما الحالة تتحقق الكود بيكمل ينفذ الحالات اللي تحتها كلها لحد ما يقابل break. أحيانًا ده بيكون مقصود، لكن غالبًا بيكون خطأ. اتعوّد تكتب break في آخر كل case.`,bad:`const x = 1;
switch (x) {
  case 1: console.log("واحد");
  case 2: console.log("اتنين");
  default: console.log("غيرهم");
}`,good:`const x = 1;
switch (x) {
  case 1: console.log("واحد"); break;
  case 2: console.log("اتنين"); break;
  default: console.log("غيرهم");
}`},
{h:'اعتبار "false" أو "0" نصًا falsy',p:`النص <code>"false"</code> والنص <code>"0"</code> truthy لأنهم نصوص مش فاضية! الغلط ده بيظهر لما تقرا قيمة من مكان بتيجي نص. لازم تقارن القيمة صراحة: <code>value === "false"</code> أو تحوّلها لرقم الأول.`,bad:`const flag = "false";
if (flag) console.log("اتنفّذ رغم إنها false!");`,good:`const flag = "false";
if (flag === "true") console.log("مفعّل");
else console.log("مش مفعّل");`}
],
ex:{id:'e4',task:`<b>التمرين:</b> اكتب دالة <code>grade(score)</code> ترجع <code>"A"</code> لو الدرجة 90 أو أكتر، و<code>"B"</code> لو 75 أو أكتر، وغير كده <code>"C"</code>. (الاستدعاءات مكتوبة تحت لوحدها.)`,starter:`function grade(score) {
  // اكتب الشروط هنا
}
`,after:`console.log(grade(95));
console.log(grade(80));
console.log(grade(40));`,expected:'A\nB\nC',need:[[/if/,'استخدم if / else if']],hint:`ابدأ بالأكبر: if (score >= 90) return "A"; وبعدين else if (score >= 75) ... وأخيرًا return "C".`,sol:`function grade(score) {
  if (score >= 90) return "A";
  else if (score >= 75) return "B";
  return "C";
}`},
quiz:{mcq:[
['أي كلمة تستخدم للحالة البديلة لو الشرط الأول فشل؟',['else','otherwise','elif','then'],0,'else (وجافاسكريبت مفيهاش elif، بنكتب else if).'],
['أي قيمة من دول falsy؟',["'hello'",'0','[]','{}'],1,'الصفر falsy. المصفوفة والكائن truthy.'],
['switch من غير break بيعمل إيه؟',['يوقف','يكمل للحالة اللي بعدها (fall-through)','يطلع خطأ','يرجع للأول'],1,'بيكمل تنفيذ الحالات اللي تحته.'],
['ناتج الشرط (5 > 3 && 2 > 4) هو؟',['true','false','خطأ','undefined'],1,'الجزء التاني false فالنتيجة false.'],
['أنسب أداة لو بتقارن قيمة واحدة بحالات كتير؟',['switch','for','while','try'],0,'switch معمول للحالات المتعددة.']
],es:[
['اشرح if و else if و else بمثال.',['if','else if|elseif','else|والا|غير كده','شرط|condition'],'if للشرط الأول، else if لشروط إضافية، else لما مفيش شرط اتحقق. مثال: if (x>10) ... else if (x>5) ... else ...'],
['اذكر القيم falsy في جافاسكريبت.',['0','false','null','undefined','nan|""|نص فاضي'],'false و0 و"" و null و undefined و NaN.'],
['إمتى نستخدم switch بدل if؟',['قيمة|متغير واحد|متغير','حالات|case|خيارات','switch'],'لما نقارن متغير واحد بحالات مختلفة كتير، بتبقى أوضح من if كتيرة.'],
['ليه ترتيب else if مهم؟',['اول|الاول|ترتيب|بالترتيب','شرط|شروط|conditions','يتوقف|يتنفذ|ينفذ|مطابق|اول شرط'],'لأن جافاسكريبت بتنفذ أول شرط يتحقق وبتتجاهل الباقي، فلازم الشروط الأدق تيجي الأول.'],
['إيه دور break في switch؟',['break','يوقف|يخرج|ينهي|بيوقف','fall|يكمل|الحالة اللي بعدها|بعدها'],'بتوقف تنفيذ الـ switch بعد الحالة المطابقة عشان الكود ما يكملش للحالات اللي بعدها.']
]},
sum:['if / else if / else بتفحص من فوق لتحت وتقف عند أول شرط صحيح.','falsy: false, 0, "", null, undefined, NaN.','switch للمقارنة بحالات كتير، ولازم break.','رتّب الشروط من الأدق للأعم.']},

{id:5,t:'الحلقات',sub:'for / while / for…of',lang:'js',
intro:`لو طلب منك المدرس تكتب اسمك 100 مرة مش هتكتبه بإيدك مية مرة وهتدور على طريقة أسرع. الحلقة هي طريقة تقول فيها للكمبيوتر: كرر الحاجة دي كذا مرة أو لحد ما يحصل شرط معين.`,
parts:[
{h:'for: لما نعرف عدد المرات',p:`فيها تلات أجزاء: <code>بداية; شرط; تحديث</code>. مثلًا <code>let i = 0; i &lt; 5; i++</code> يعني ابدأ من 0 وكرر طول ما i أصغر من 5 وزوّد i بواحد كل مرة.`,c:`for (let i = 1; i <= 5; i++) {
  console.log("الدور رقم", i);
}`},
{h:'while و do…while',p:`<code>while</code> بتكرر طول ما الشرط صح ومناسبة لما منعرفش عدد المرات. و<code>do…while</code> بتنفذ مرة واحدة على الأقل وبعدين تفحص الشرط.`,c:`let money = 100;
while (money > 30) {
  money -= 25;
  console.log("فاضل", money);
}
let k = 10;
do { console.log("بتتنفذ مرة على الأقل", k); } while (k < 5);`},
{h:'for…of للمرور على عناصر',p:`لما تحب تمر على كل عنصر في مصفوفة أو نص من غير ما تحتاج العدّاد.`,c:`const fruits = ["تفاح", "موز", "برتقال"];
for (const f of fruits) {
  console.log(f);
}
for (const ch of "abc") console.log(ch);`},
{h:'break و continue',p:`<code>break</code> بتخرج من الحلقة نهائيًا. <code>continue</code> بتتخطى الدورة الحالية وتروح للي بعدها.`,c:`for (let i = 1; i <= 8; i++) {
  if (i === 3) continue;   // اتخطى 3
  if (i === 6) break;      // اخرج عند 6
  console.log(i);
}`}
],
mis:[
{h:'الحلقة اللانهائية',p:`لو شرط الحلقة فضل <code>true</code> للأبد (غالبًا لأنك نسيت تحدّث العدّاد) المتصفح هيهنّج. مثال: while (i &lt; 5) من غير i++ جواها. قبل ما تشغّل أي حلقة اسأل نفسك: إيه اللي هيخلي الشرط يبقى false في الآخر؟ (المحرر هنا بيوقف الكود بعد ثواني لو دخل في حلقة بلا نهاية.)`,bad:`let i = 0;
while (i < 5) {
  console.log(i);
}`,good:`let i = 0;
while (i < 5) {
  console.log(i);
  i++;
}`},
{h:'خطأ بواحد (Off-by-one)',p:`أشهر خطأ في الحلقات. المصفوفة اللي طولها 3 عناصرها أرقامها 0 و1 و2. لو كتبت <code>i &lt;= arr.length</code> هتوصل لـ arr[3] وده مش موجود فيطلع undefined. استخدم <code>&lt;</code> مع الـ length.`,bad:`const a = ["x", "y", "z"];
for (let i = 0; i <= a.length; i++) {
  console.log(a[i]);
}`,good:`const a = ["x", "y", "z"];
for (let i = 0; i < a.length; i++) {
  console.log(a[i]);
}`},
{h:'استخدام var جوه حلقة مع دوال مؤجلة',p:`مع <code>var</code> فيه نسخة واحدة من المتغير للحلقة كلها. لما الدوال المؤجلة (setTimeout) تتنفذ تكون الحلقة خلصت وقيمة i بقت 3 للكل. <code>let</code> بيعمل نسخة جديدة في كل دورة فبيشتغل صح.`,bad:`for (var i = 0; i < 3; i++) {
  setTimeout(() => console.log(i), 0);
}`,good:`for (let i = 0; i < 3; i++) {
  setTimeout(() => console.log(i), 0);
}`}
],
ex:{id:'e5',task:`<b>التمرين:</b> اطبع مجموع الأرقام من 1 لـ 10 (يعني <code>55</code>) باستخدام حلقة.`,starter:`let sum = 0;
// اكتب الحلقة هنا

console.log(sum);
`,expected:'55',need:[[/for|while/,'لازم تستخدم حلقة for أو while']],hint:`for (let i = 1; i <= 10; i++) { sum += i; }`,sol:`let sum = 0;
for (let i = 1; i <= 10; i++) {
  sum += i;
}
console.log(sum);`},
quiz:{mcq:[
['كام مرة هتتنفذ: for (let i = 0; i < 5; i++) ؟',['4','5','6','بلا نهاية'],1,'من 0 لـ 4 يعني 5 مرات.'],
['أي أمر بيخرج من الحلقة نهائيًا؟',['continue','break','stop','exit'],1,'break بتنهي الحلقة.'],
['أي حلقة بتتنفذ مرة واحدة على الأقل؟',['for','while','do...while','for...of'],2,'do...while بتنفذ الأول وبعدين بتفحص.'],
['for...of بنستخدمها مع؟',['مصفوفات ونصوص','أرقام فقط','دوال','لا شيء'],0,'للمرور على عناصر قابلة للتكرار.'],
['إيه سبب إن while (i < 5) { console.log(i) } لا تنتهي؟',['الشرط بيفضل صح للأبد','كتابة خاطئة','i غير معرف','مفيش مشكلة'],0,'محدش بيزوّد i فالشرط مش بيبقى false.']
],es:[
['اشرح الفرق بين for و while.',['for','while','عدد|معروف|مرات','شرط'],'for لما نعرف عدد التكرارات، و while لما التكرار يعتمد على شرط مش معروف عدد مراته.'],
['اشرح الفرق بين break و continue.',['break','continue','يخرج|يوقف|ينهي|بيخرج|بتخرج','يتخطى|يكمل|الحالية|التالية|تتخطى'],'break بتخرج من الحلقة كلها، continue بتتخطى الدورة الحالية وتكمل للتالية.'],
['اكتب (كنص) كود يجمع الأرقام من 1 لـ 10 واشرحه.',['حلقة|for|while','مجموع|sum|total|جمع','+=|+'],'let sum=0; for(let i=1;i<=10;i++){ sum+=i; } console.log(sum); بنزوّد كل رقم على المجموع.'],
['إيه هي الحلقة اللانهائية وإزاي نتجنبها؟',['لانهاية|لا نهاية|infinite|تفضل|للابد|بلا نهاية','شرط','i++|زيادة|تحديث|عداد'],'حلقة شرطها دايمًا صح. بنتجنبها بإننا نغيّر العدّاد داخلها ونتأكد إن الشرط هيبقى false.'],
['إمتى نستخدم for...of؟',['مصفوفة|مصفوفات|array','عناصر|عنصر|قيم','for'],'لما نعوز نمر على كل عناصر مصفوفة أو نص من غير عدّاد.']
]},
sum:['for لما نعرف العدد، while لما الشرط هو الأساس.','for…of للمرور على عناصر المصفوفة والنصوص.','break تخرج، continue تتخطى الدورة.','احذر الحلقة اللانهائية وخطأ الواحد (<= مع length).','استخدم let جوه الحلقات مش var.']},

{id:6,t:'الدوال',sub:'function / arrow / scope',lang:'js',
intro:`ماكينة العصير: بتحط فاكهة (مدخلات)، بتضغط زرار، وبيطلع عصير (مخرجات). مش بتفكر في إزاي بتشتغل جواها وتقدر تستخدمها كل مرة. الدالة هي ماكينة كود: بنكتبها مرة واحدة وبنستخدمها بعدد مرات غير محدود.`,
parts:[
{h:'تعريف الدالة واستدعاؤها',p:`بنعرّف الدالة بـ <code>function</code> واسم وأقواس وجسم بين <code>{ }</code>. التعريف لوحده مبينفذش حاجة، لازم <b>نستدعيها</b> بالاسم وأقواس <code>()</code>. الكلمة <code>return</code> بترجّع النتيجة وبتوقف الدالة.`,c:`function greet(name) {
  return "أهلاً يا " + name;
}
console.log(greet("Ali"));
console.log(greet("Mona"));`},
{h:'المعاملات والقيم الافتراضية',p:`الأسماء اللي بين الأقواس وقت التعريف اسمها <b>معاملات (parameters)</b>، والقيم اللي بنبعتها وقت الاستدعاء اسمها <b>وسائط (arguments)</b>. ولو عايز قيمة افتراضية لما المستخدم ميبعتش حاجة حطها بعلامة <code>=</code>.`,c:`function price(base, tax = 0.14) {
  return base + base * tax;
}
console.log(price(100));
console.log(price(100, 0.05));`},
{h:'الدوال السهمية (Arrow)',p:`صيغة مختصرة وحديثة. لو الجسم تعبير واحد تقدر تشيل الأقواس <code>{ }</code> و<code>return</code> وهي هترجّع النتيجة لوحدها.`,c:`const square = (n) => n * n;
const add = (a, b) => a + b;
const hello = () => {
  console.log("مرحبا");
};
console.log(square(5), add(2, 3));
hello();`},
{h:'النطاق (Scope)',p:`المتغير المعرّف <b>جوه</b> الدالة بيعيش جواها بس ومش ظاهر بره. المتغير المعرّف بره بتشوفه الدالة. كل دالة عندها «عالمها الخاص» وده بيحمي الكود من التداخل.`,c:`const outside = "أنا بره";
function test() {
  const inside = "أنا جوه";
  console.log(outside);
  console.log(inside);
}
test();
console.log(typeof inside);`},
{h:'الدالة كقيمة (Callback)',p:`في جافاسكريبت الدالة قيمة عادية تقدر تبعتها لدالة تانية. الدالة اللي بتتبعت اسمها callback، وده أساس كل التعامل مع الأحداث والبيانات المتأخرة.`,c:`function repeat(n, action) {
  for (let i = 1; i <= n; i++) action(i);
}
repeat(3, (i) => console.log("المرة", i));`}
],
mis:[
{h:'نسيان return',p:`لو الدالة خلصت من غير <code>return</code> هترجع <code>undefined</code> حتى لو حسبت النتيجة صح جواها. <code>console.log</code> جوه الدالة بتطبع بس لكنها مش بترجّع قيمة تقدر تستخدمها في مكان تاني. افصل بين «الطباعة» و«الإرجاع».`,bad:`function add(a, b) {
  a + b;
}
console.log(add(2, 3));`,good:`function add(a, b) {
  return a + b;
}
console.log(add(2, 3));`},
{h:'استدعاء الدالة من غير أقواس',p:`<code>greet</code> هي الدالة نفسها كقيمة، و<code>greet()</code> هي اللي بتنفذها. لو كتبت الاسم من غير أقواس مش هتحصل الحاجة المطلوبة وهتتطبع الدالة بدل نتيجتها.`,bad:`function greet() { return "hi"; }
console.log(greet);`,good:`function greet() { return "hi"; }
console.log(greet());`},
{h:'استخدام متغير الدالة بره الدالة',p:`المتغير اللي اتعرّف جوه دالة بيموت لما الدالة تخلص. لو عايز تستخدم القيمة بره ارجعها بـ <code>return</code> وخزنها في متغير بره.`,bad:`function calc() {
  const result = 10 * 2;
}
calc();
console.log(result);`,good:`function calc() {
  return 10 * 2;
}
const result = calc();
console.log(result);`}
],
ex:{id:'e6',task:`<b>التمرين:</b> اكتب دالة <code>add(a, b)</code> ترجّع مجموع الرقمين. (الاستدعاءات مكتوبة تحت لوحدها.)`,starter:`function add(a, b) {
  // اكتب هنا
}
`,after:`console.log(add(2, 3));
console.log(add(-1, 1));`,expected:'5\n0',need:[[/return/,'الدالة لازم ترجّع النتيجة بـ return']],hint:`return a + b;`,sol:`function add(a, b) {
  return a + b;
}`},
quiz:{mcq:[
['إيه اللي بترجعه الدالة لو مفيهاش return؟',['0','null','undefined','نص فاضي'],2,'الدالة من غير return بترجع undefined.'],
['أي صيغة arrow function صحيحة؟',['(a, b) => a + b','function => (a, b)','a, b -> a + b','=> a + b (a, b)'],0,'الصيغة (معاملات) => تعبير.'],
['المتغير المعرّف جوه دالة بـ let بيتشاف؟',['في كل مكان','جوه الدالة بس','في الملف كله','بعد استدعاء الدالة بس'],1,'نطاقه محصور داخل الدالة.'],
['function f(a, b = 2) { return a + b } ... f(1) بتساوي؟',['3','NaN','1','undefined'],0,'b بياخد القيمة الافتراضية 2 فالنتيجة 3.'],
['إيه الفرق بين f و f() ؟',['مفيش فرق','f هي الدالة نفسها وf() بتنفذها','f() أسرع','f خطأ'],1,'الأقواس هي اللي بتستدعي الدالة.']
],es:[
['إيه هي الدالة ولماذا نستخدمها؟',['كود|اوامر|تعليمات|كتلة','اعادة|تكرار|مرة تانية|reuse|نستخدمها كتير','اسم|ننادي|استدعاء'],'كتلة كود بنكتبها مرة وبنستدعيها بالاسم أكتر من مرة، فبتقلل التكرار وبتنظم الكود.'],
['اشرح الفرق بين parameter و argument.',['parameter|بارامتر|معامل','argument|ارجيومنت|وسيط|قيمة','تعريف|استدعاء'],'parameter اسم بنكتبه وقت تعريف الدالة، و argument القيمة الفعلية اللي بنبعتها وقت الاستدعاء.'],
['اشرح وظيفة return.',['return','قيمة|ترجع|نتيجة|ترجّع','يوقف|تنتهي|ينهي|توقف'],'return بترجّع قيمة من الدالة وبتوقف تنفيذها عند السطر ده.'],
['إيه هو الـ scope؟',['scope|نطاق|مجال','داخل|جوه','خارج|برا|بره'],'النطاق هو المكان اللي المتغير بيكون شايفه فيه؛ المتغير داخل الدالة مش ظاهر خارجها.'],
['اكتب arrow function بتضرب رقمين واشرح صيغتها.',['=>','*','سهم|arrow|دالة'],'const mul = (a, b) => a * b; السهم => بيفصل المعاملات عن الجسم، ومن غير أقواس بيرجّع الناتج تلقائيًا.']
]},
sum:['الدالة كود قابل لإعادة الاستخدام، بتتعرّف مرة وتتستدعى بـ ().','return بترجّع النتيجة وبتوقف الدالة.','المعاملات وقت التعريف، والوسائط وقت الاستدعاء، ويمكن إعطاء قيم افتراضية.','Arrow function: (a, b) => a + b.','المتغيرات جوه الدالة مش ظاهرة بره.']},

{id:7,t:'المصفوفات',sub:'Arrays + map / filter / reduce',lang:'js',
intro:`قطار عربياته مرقمة من الأول للآخر وكل عربية فيها حاجة. المصفوفة هي كده: قائمة مرتبة من القيم، وكل قيمة ليها رقم بيبدأ من <b>صفر</b> مش من واحد.`,
parts:[
{h:'إنشاء مصفوفة والوصول لعناصرها',p:`بنكتبها بين <code>[ ]</code> والعناصر بينها فاصلة. أول عنصر رقمه <code>0</code> وآخر عنصر رقمه <code>length - 1</code>.`,c:`const fruits = ["تفاح", "موز", "برتقال"];
console.log(fruits[0]);
console.log(fruits.length);
console.log(fruits[fruits.length - 1]);`},
{h:'الإضافة والحذف',p:`<code>push</code> تضيف في الآخر، <code>pop</code> تشيل من الآخر، <code>unshift</code> تضيف في الأول، <code>shift</code> تشيل من الأول. ولفحص عنصر: <code>includes</code> و<code>indexOf</code>، ولقص جزء: <code>slice</code>.`,c:`const a = [1, 2, 3];
a.push(4);
a.unshift(0);
console.log(a);
a.pop();
a.shift();
console.log(a);
console.log(a.includes(2), a.indexOf(3));
console.log(a.slice(1, 3));`},
{h:'map و filter و reduce',p:`أقوى ثلاث أدوات للتعامل مع القوائم. <code>map</code> بتحوّل كل عنصر وترجع مصفوفة جديدة بنفس الطول. <code>filter</code> بتختار العناصر اللي بتحقق شرط. <code>reduce</code> بتجمّع كل العناصر في قيمة واحدة (زي المجموع). و<code>find</code> بترجع أول عنصر يطابق الشرط.`,c:`const nums = [1, 2, 3, 4, 5, 6];
const doubled = nums.map((n) => n * 2);
const evens = nums.filter((n) => n % 2 === 0);
const total = nums.reduce((sum, n) => sum + n, 0);
const firstBig = nums.find((n) => n > 3);
console.log(doubled);
console.log(evens);
console.log(total);
console.log(firstBig);`},
{h:'الترتيب والدمج',p:`<code>sort()</code> بترتب، و<code>join()</code> بتجمع العناصر في نص، و<code>forEach</code> بتنفذ دالة لكل عنصر. وانتبه إن sort من غير دالة مقارنة بترتب كنصوص.`,c:`const names = ["Sara", "Ali", "Mona"];
console.log(names.sort().join(", "));
const nums = [10, 9, 1];
console.log(nums.sort((a, b) => a - b));
["x", "y"].forEach((v, i) => console.log(i, v));`}
],
mis:[
{h:'ترتيب الأرقام بـ sort() العادية',p:`الدالة <code>sort()</code> من غير تعليمات بتحوّل العناصر لنصوص وبترتبها أبجديًا. فالرقم 10 بيجي قبل 9 لأن النص "10" بيبدأ بـ "1". لازم تديها دالة مقارنة: <code>(a, b) => a - b</code> للترتيب التصاعدي.`,bad:`console.log([10, 9, 1].sort());`,good:`console.log([10, 9, 1].sort((a, b) => a - b));`},
{h:'نسخ مصفوفة بـ =',p:`المصفوفة بتتخزن كـ «مرجع». لما تكتب <code>b = a</code> انت مش بتعمل نسخة، انت بتعمل اسم تاني لنفس المصفوفة. فأي تعديل على b هيغير a كمان. لعمل نسخة حقيقية استخدم <code>[...a]</code> أو <code>a.slice()</code>.`,bad:`const a = [1, 2];
const b = a;
b.push(3);
console.log(a);`,good:`const a = [1, 2];
const b = [...a];
b.push(3);
console.log(a, b);`},
{h:'التعامل مع دالة map كأنها بتعدّل الأصل',p:`<code>map</code> و<code>filter</code> بيرجعوا مصفوفة <b>جديدة</b> ومبيغيروش الأصلية. لو ما خزنتش الناتج في متغير هتضيع النتيجة وتفتكر إن الكود مش شغال.`,bad:`const a = [1, 2, 3];
a.map((n) => n * 2);
console.log(a);`,good:`const a = [1, 2, 3];
const b = a.map((n) => n * 2);
console.log(b);`}
],
ex:{id:'e7',task:`<b>التمرين:</b> عندك <code>nums = [1,2,3,4,5,6]</code>. اطبع مجموع الأرقام <b>الزوجية</b> فقط (النتيجة <code>12</code>).`,starter:`const nums = [1, 2, 3, 4, 5, 6];
// اكتب هنا
`,expected:'12',need:[[/filter|for|while|reduce|forEach/,'استخدم filter/reduce أو حلقة']],hint:`nums.filter(n => n % 2 === 0).reduce((s, n) => s + n, 0)`,sol:`const nums = [1, 2, 3, 4, 5, 6];
const sum = nums
  .filter((n) => n % 2 === 0)
  .reduce((s, n) => s + n, 0);
console.log(sum);`},
quiz:{mcq:[
['رقم (index) أول عنصر في المصفوفة؟',['0','1','-1','first'],0,'الترقيم بيبدأ من الصفر.'],
['أي دالة بتضيف عنصر في آخر المصفوفة؟',['push','pop','shift','add'],0,'push تضيف في الآخر.'],
['ناتج [1,2,3].map(x => x * 2) ؟',['[2,4,6]','[1,2,3]','6','undefined'],0,'map بتطبّق الدالة على كل عنصر.'],
['ناتج [10,9,1].sort() ؟',['[1,9,10]','[1,10,9]','[10,9,1]','[9,10,1]'],1,'sort بترتب كنصوص فـ "10" قبل "9".'],
['أي دالة بتختار العناصر اللي بتحقق شرط؟',['filter','map','reduce','join'],0,'filter بترجع المطابق للشرط بس.']
],es:[

{id:8,t:'الكائنات و JSON',sub:'Objects',lang:'js',
intro:`بطاقة الرقم القومي: فيها اسم وسن وعنوان وتاريخ ميلاد. كل معلومة ليها <b>عنوان</b> (مفتاح) و<b>قيمة</b>. الكائن (Object) هو بطاقة بيانات لأي حاجة: طالب، منتج، سيارة.`,
parts:[
{h:'إنشاء كائن والوصول لخصائصه',p:`بنكتبها بين <code>{ }</code> وكل خاصية <code>مفتاح: قيمة</code>. بنوصل للقيمة بالنقطة <code>obj.name</code> أو بالأقواس <code>obj["name"]</code>. والأقواس مفيدة لما اسم الخاصية في متغير.`,c:`const student = { name: "Sara", age: 17, grades: [90, 85] };
console.log(student.name);
console.log(student["age"]);
student.city = "Cairo";   // إضافة
student.age = 18;         // تعديل
delete student.grades;    // حذف
console.log(student);`},
{h:'الدوال داخل الكائن و this',p:`لو خاصية قيمتها دالة بنسميها method. وجواها بنستخدم <code>this</code> للإشارة للكائن نفسه.`,c:`const car = {
  brand: "Toyota",
  speed: 0,
  accelerate() {
    this.speed += 10;
    return this.speed;
  }
};
console.log(car.accelerate());
console.log(car.accelerate());`},
{h:'Object.keys / values / entries',p:`لمعرفة مفاتيح الكائن أو قيمه أو الاتنين مع بعض والمرور عليهم بحلقة.`,c:`const p = { a: 1, b: 2 };
console.log(Object.keys(p), Object.values(p));
for (const [k, v] of Object.entries(p)) {
  console.log(k, v);
}`},
{h:'JSON والتفكيك والنسخ',p:`<b>JSON</b> صيغة نص لتبادل البيانات بين البرامج (السيرفر والمتصفح). <code>JSON.stringify</code> بتحوّل الكائن لنص و<code>JSON.parse</code> بترجعه. و<b>التفكيك (destructuring)</b> بيطلّع القيم في متغيرات بسطر واحد، و<code>...</code> (spread) بتنسخ وتدمج كائنات.`,c:`const user = { name: "Omar", age: 20 };
const text = JSON.stringify(user);
console.log(text);
console.log(JSON.parse(text).name);
const { name, age } = user;
console.log(name, age);
const copy = { ...user, age: 21 };
console.log(copy);`}
],
mis:[
{h:'القراءة من كائن غير موجود',p:`أشهر رسالة خطأ في جافاسكريبت: <code>Cannot read properties of undefined</code>. بتحصل لما تحاول تقرا خاصية من حاجة قيمتها undefined، زي <code>user.address.city</code> لو user ملوش address. الحل الحديث هو <code>?.</code> (optional chaining) اللي بترجع undefined بدل ما تضرب خطأ، ويمكن تعمل فحص بـ if.`,bad:`const user = { name: "Ali" };
console.log(user.address.city);`,good:`const user = { name: "Ali" };
console.log(user.address?.city);
console.log(user.address?.city ?? "مفيش عنوان");`},
{h:'مقارنة كائنين بـ ===',p:`الكائنات بتتقارن بالمرجع مش بالمحتوى. حتى لو كائنين شبه بعض تمامًا هم اتنين مختلفين في الذاكرة فالنتيجة false. لو عايز تقارن المحتوى حوّلهم لنص بـ JSON.stringify أو قارن الخصائص واحدة واحدة.`,bad:`console.log({ a: 1 } === { a: 1 });`,good:`console.log(JSON.stringify({ a: 1 }) === JSON.stringify({ a: 1 }));`},
{h:'استخدام النقطة مع اسم خاصية في متغير',p:`<code>obj.key</code> بتدور على خاصية اسمها حرفيًا «key» مش على القيمة اللي في المتغير key. لو الاسم جوه متغير لازم تستخدم الأقواس <code>obj[key]</code>.`,bad:`const obj = { name: "Sara" };
const key = "name";
console.log(obj.key);`,good:`const obj = { name: "Sara" };
const key = "name";
console.log(obj[key]);`}
],
ex:{id:'e8',task:`<b>التمرين:</b> عندك كائن الطالب. اطبع <b>متوسط</b> درجاته (النتيجة <code>90</code>).`,starter:`const student = { name: "Sara", grades: [80, 90, 100] };
// اكتب هنا
`,expected:'90',need:[[/grades/,'استخدم student.grades']],hint:`اجمع الدرجات (reduce أو حلقة) ثم اقسم على student.grades.length`,sol:`const student = { name: "Sara", grades: [80, 90, 100] };
const sum = student.grades.reduce((s, g) => s + g, 0);
console.log(sum / student.grades.length);`},

{id:9,t:'DOM والأحداث',sub:'تحكّم في صفحة الويب',lang:'html',
intro:`صفحة الويب زي بيت: فيها أوض (عناصر) وأثاث. الـ DOM هو «خريطة» البيت دي اللي جافاسكريبت بتشوفها. تقدر تروح لأي أوضة، تغيّر لون الحيطة، تضيف أو تشيل أثاث، وتعمل جرس: لما حد يضغط (حدث) يحصل رد فعل.`,
parts:[
{h:'اختيار العناصر وتعديلها',p:`<code>getElementById</code> لعنصر له id، و<code>querySelector</code> بيرجع أول عنصر يطابق محدد CSS، و<code>querySelectorAll</code> بترجع كلهم. بعدها غيّر <code>textContent</code> أو <code>style</code> أو <code>classList</code>. (ملاحظة: الأمثلة هنا بتشتغل في معاينة صفحة ويب.)`,c:`<h1 id="title">أهلاً</h1>
<p class="note">فقرة عادية</p>
<script>
const t = document.getElementById("title");
const n = document.querySelector(".note");
t.textContent = "اتغيّر من JavaScript";
n.style.color = "crimson";
n.classList.add("done");
<\/script>`},
{h:'الأحداث',p:`بنربط دالة بحدث بـ <code>addEventListener</code>. أشهر الأحداث: <code>click</code> و<code>input</code> و<code>submit</code> و<code>keydown</code>. الدالة بتتنفذ كل مرة الحدث يحصل.`,c:`<button id="btn">اضغط عليا</button>
<p id="out">العدّاد: 0</p>
<script>
let count = 0;
const btn = document.getElementById("btn");
const out = document.getElementById("out");
btn.addEventListener("click", () => {
  count++;
  out.textContent = "العدّاد: " + count;
});
<\/script>`},
{h:'إنشاء عناصر جديدة',p:`<code>createElement</code> بتعمل عنصر جديد، تحط فيه محتوى، وبعدين <code>append</code> بتحطه في الصفحة. بكده بتبني قوائم ديناميكية.`,c:`<input id="name" placeholder="اسم">
<button id="add">أضف</button>
<ul id="list"></ul>
<script>
const input = document.getElementById("name");
const list = document.getElementById("list");
document.getElementById("add").addEventListener("click", () => {
  if (!input.value.trim()) return;
  const li = document.createElement("li");
  li.textContent = input.value;
  list.append(li);
  input.value = "";
});
<\/script>`},
{h:'الفورم و preventDefault',p:`لما بنعمل submit للفورم المتصفح بيعيد تحميل الصفحة. بنمنع ده بـ <code>event.preventDefault()</code> وبنتعامل مع البيانات بنفسنا.`,c:`<form id="f">
  <input id="who" placeholder="اسمك">
  <button>ارسل</button>
</form>
<p id="msg"></p>
<script>
document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  document.getElementById("msg").textContent = "أهلاً يا " + document.getElementById("who").value;
});
<\/script>`}
],
mis:[
{h:'تشغيل السكريبت قبل ما العناصر تتحمّل',p:`المتصفح بيقرا الصفحة من فوق لتحت. لو السكريبت جه <b>قبل</b> العنصر اللي بتدور عليه، <code>getElementById</code> هترجع <code>null</code> وأي استخدام بعدها هيطلّع خطأ. الحل: ضع السكريبت في آخر <code>body</code> أو استخدم <code>defer</code> أو حدث <code>DOMContentLoaded</code>.`,norun:true,bad:`<script>
  document.getElementById("a").textContent = "x"; // null!
<\/script>
<p id="a"></p>`,good:`<p id="a"></p>
<script>
  document.getElementById("a").textContent = "x";
<\/script>`},
{h:'استخدام innerHTML مع مدخلات المستخدم',p:`لو حطيت نص كتبه المستخدم جوه <code>innerHTML</code> والمستخدم كتب كود HTML أو سكريبت، المتصفح هينفذه. دي ثغرة اسمها XSS وبتسمح بسرقة بيانات. القاعدة: للنصوص العادية استخدم <code>textContent</code> دايمًا.`,norun:true,bad:`el.innerHTML = userInput;`,good:`el.textContent = userInput;`},
{h:'نسيان preventDefault في الفورم',p:`من غير <code>preventDefault()</code> الصفحة بتتحمل من جديد بعد الضغط على الزرار وكل حاجة كتبتها بتضيع قبل ما كودك يكمل. دايمًا اكتبها في أول معالج submit لما تحب تتحكم في الفورم بجافاسكريبت.`,norun:true,bad:`form.addEventListener("submit", () => {
  console.log("هتختفي بعد إعادة التحميل");
});`,good:`form.addEventListener("submit", (e) => {
  e.preventDefault();
  console.log("اتنفّذ والصفحة مش بتتحمل تانيعية");
});`}
],
ex:{id:'e9',mode:'html',height:150,task:`<b>التمرين:</b> اكتب كود جافاسكريبت بحيث لما يتضغط الزرار <code>#btn</code> يتغيّر نص الفقرة <code>#msg</code> ويبقى <code>Done</code> بالظبط. اضغط «شغّل وصحّح» وهتتأكد الصفحة بنفسها بتضغط الزرار.`,starter:`<button id="btn">اضغط</button>
<p id="msg">لسه</p>
<script>
// اكتب الكود هنا
<\/script>`,test:d=>{const b=d.getElementById('btn'),m=d.getElementById('msg');if(!b||!m)return 'مش لاقي العنصر #btn أو #msg. ما تغيّرش الـ id بتاعهم.';const before=m.textContent.trim();b.click();const t=m.textContent.trim();if(t==='Done')return null;if(t===before)return 'لما اتضغط الزرار النص ما اتغيّرش. اتأكد إنك ربطت حدث click بالزرار وغيّرت textContent.';return 'بعد الضغط النص بقى «'+t+'» والمطلوب «Done» بالظبط.'},hint:`const btn = document.getElementById("btn"); btn.addEventListener("click", () => { document.getElementById("msg").textContent = "Done"; });`,sol:`<button id="btn">اضغط</button>
<p id="msg">لسه</p>
<script>
document.getElementById("btn").addEventListener("click", () => {
  document.getElementById("msg").textContent = "Done";
});
<\/script>`},

{id:10,t:'الكود غير المتزامن والأخطاء',sub:'Promise / async / try-catch',lang:'js',
intro:`بتطلب أكل من مطعم. هل بتفضل واقف قدام الشباك مش بتعمل حاجة؟ لأ، بتطلب وتقعد تعمل حاجات تانية وبيندهوا عليك لما الأكل يجهز. ده الكود غير المتزامن: بنبدأ عملية بطيئة (تحميل بيانات من سيرفر) ونكمل شغلنا، والنتيجة ترجع لما تجهز.`,
parts:[
{h:'الكود المتزامن وغير المتزامن',p:`الكود العادي بيتنفذ سطر ورا سطر. لكن <code>setTimeout</code> بتأجل دالة لوقت معين من غير ما توقف الباقي. فالترتيب اللي بيتنفذ بيه الكود مش دايمًا ترتيب الكتابة.`,c:`console.log("1) طلبت الأكل");
setTimeout(() => console.log("3) الأكل وصل"), 1000);
console.log("2) بعمل حاجات تانية وأنا مستني");`},
{h:'الوعد (Promise)',p:`<code>Promise</code> هو «وعد» بنتيجة هتيجي بعدين. له تلات حالات: <b>pending</b> (لسه شغال)، <b>fulfilled</b> (نجح بنتيجة)، <b>rejected</b> (فشل بخطأ). بنستقبل النتيجة بـ <code>then</code> والخطأ بـ <code>catch</code> و<code>finally</code> بتتنفذ في الحالتين.`,c:`const p = new Promise((resolve, reject) => {
  setTimeout(() => resolve("تمت العملية"), 500);
});
p.then((v) => console.log(v))
 .catch((e) => console.log("فشل", e))
 .finally(() => console.log("خلصنا"));`},
{h:'async / await',p:`طريقة أبسط لكتابة نفس الشيء: <code>async</code> قبل الدالة، و<code>await</code> قبل أي Promise بتخلي الدالة «تستنى» النتيجة وتكمل بعدها، وبكده بيبان الكود كأنه متزامن.`,c:`function wait(ms) {
  return new Promise((r) => setTimeout(r, ms));
}
async function main() {
  console.log("بدأنا");
  await wait(500);
  console.log("بعد نص ثانية");
  return "تمام";
}
main().then((r) => console.log(r));`},

fixStrings(LESSONS);fixStrings(PROJECTS);

/* ================= الصفحات ================= */
const VIEWS=[['lessons','الدروس'],['projects','المشاريع (12)'],['play','المحرر الحر'],['summary','ملخص اللغة']];
function setNav(active){$('#views').innerHTML=VIEWS.map(([k,t])=>'<a href="#'+k+'" class="'+(k===active?'on':'')+'">'+t+'</a>').join('')}
const main=()=>$('#main');

function renderHome(){
  const m=main();m.innerHTML='';
  const hero=h('div','hero','<div class="crumb">JavaScript · من الصفر للمشاريع</div><h1>تعلّم <span class="mk">JavaScript</span> خطوة بخطوة</h1><p>10 دروس بشرح بأمثلة من الواقع، وأخطاء شائعة بالتفصيل، وتمرين بمحرر أكواد بيصحّح ويقولك ليه غلطت، وامتحان من 10 أسئلة بعد كل درس، و12 مشروع تتعمل بإيدك.</p>');
  m.append(hero);
  const done=LESSONS.filter(L=>prog.ex[L.ex.id]).length;
  const grid=h('div','grid');grid.style.marginTop='18px';
  LESSONS.forEach(L=>{
    const a=h('a','card lcard');a.href='#l'+L.id;
    const q=prog.quiz[L.id];
    a.innerHTML='<span class="num">'+String(L.id).padStart(2,'0')+'</span><h3 style="margin:0">'+esc(L.t)+'</h3><small>'+esc(L.sub)+'</small><div class="badges">'+(prog.ex[L.ex.id]?'<span class="pill ok">تمرين ✓</span>':'')+(q!==undefined?'<span class="pill ok">امتحان '+q+'/10</span>':'')+'</div>';
    grid.append(a);
  });
  m.append(grid);
  m.append(h('p','note','تقدمك: أنهيت '+done+' من '+LESSONS.length+' تمارين. الأقسام الجاية: HTML وCSS وPython بنفس الشكل.'));
  m.lastChild.style.marginTop='18px';
}

function renderLesson(id){
  const L=LESSONS.find(x=>x.id===id);if(!L)return renderHome();
  const m=main();m.innerHTML='';
  m.append(h('div','hero','<div class="crumb">JavaScript / الدرس '+id+' من '+LESSONS.length+'</div><h1><span class="mk">'+esc(L.t)+'</span></h1>'));
  const tabs=h('div','tabs'),body=h('div','stack');
  const T=[['learn','الشرح والأمثلة'],['mist','الأخطاء الشائعة'],['ex','تمرين بمحرر'],['quiz','الامتحان'],['sum','الملخص']];
  const runMode=L.lang==='html'?'html':'js';
  function show(k){
    tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
    body.innerHTML='';
    if(k==='learn'){
      body.append(h('div','analogy','<b>مثال من الواقع:</b> '+L.intro));
      L.parts.forEach(p=>{
        const c=h('div','card part','<h3>'+esc(p.h)+'</h3><p>'+p.p+'</p>');
        c.append(codeBlock(p.c,{run:p.run===undefined?runMode:p.run}));
        body.append(c);
      });
    }else if(k==='mist'){
      body.append(h('div','note','الأخطاء دي بتقابل أي مبتدئ. اقرا الشرح وشغّل الكود الغلط وشوف رسالة الخطأ بنفسك، وبعدين شغّل الصح.'));
      L.mis.forEach((x,i)=>{
        const c=h('div','card mis part','<h3>'+(i+1)+'. '+esc(x.h)+'</h3><p>'+x.p+'</p>');
        const cols=h('div','cols');
        const r=x.norun?false:runMode;
        const a=h('div');a.append(h('span','bad','❌ غلط'),codeBlock(x.bad,{run:r}));
        const b=h('div');b.append(h('span','good','✅ صح'),codeBlock(x.good,{run:r}));
        cols.append(a,b);c.append(cols);body.append(c);
      });
    }else if(k==='ex'){
      body.append(Editor(Object.assign({title:'تمرين: '+L.t,mode:L.ex.mode||'js'},L.ex)));
    }else if(k==='quiz'){
      body.append(Quiz(L));
    }else{
      const c=h('div','card');c.innerHTML='<h2>ملخص: '+esc(L.t)+'</h2><ul class="sumlist">'+L.sum.map(s=>'<li>'+s+'</li>').join('')+'</ul>';
      body.append(c);
    }
  }
  T.forEach(([k,t])=>{const b=h('button','',t);b.type='button';b.dataset.k=k;b.onclick=()=>show(k);tabs.append(b)});
  m.append(tabs,body);
  const pager=h('div','pager');
  const prev=h('a','btn',id>1?'← الدرس السابق':'← كل الدروس');prev.href=id>1?'#l'+(id-1):'#lessons';prev.style.textDecoration='none';
  const next=h('a','btn pri',id<LESSONS.length?'الدرس التالي →':'المشاريع →');next.href=id<LESSONS.length?'#l'+(id+1):'#projects';next.style.textDecoration='none';
  pager.append(prev,next);m.append(pager);
  show('learn');
}

function renderProjects(){
  const m=main();m.innerHTML='';
  m.append(h('div','hero','<div class="crumb">مشاريع عملية</div><h1>اتعلّم بالبناء: <span class="mk">12 مشروع</span></h1><p>كل مشروع صفحة ويب كاملة في ملف واحد. افتحه، شوف الخطوات، شغّله، وبعدين عدّل فيه وطوّره بإيدك.</p>'));
  const st=h('div','stack');st.style.marginTop='18px';
  PROJECTS.forEach((p,i)=>{
    const d=h('details','card proj');
    d.innerHTML='<summary><span class="n">'+String(i+1).padStart(2,'0')+'</span><b>'+esc(p.t)+'</b><span class="pill">'+esc(p.lvl)+'</span></summary>';
    const inner=h('div','inner');

}

  const m=main();m.innerHTML='';

  m.append(bar,holder);mk('js');

function renderSummary(){
  const m=main();m.innerHTML='';
  m.append(h('div','hero','<div class="crumb">مراجعة سريعة</div><h1>ملخص لغة <span class="mk">JavaScript</span></h1><p>أهم ما في كل درس، وتحتها ورقة غش بالصيغ الأساسية.</p>'));

}

function route(){
  const hs=location.hash.slice(1)||'lessons';const lm=hs.match(/^l(\d+)$/);
  if(lm){setNav('lessons');renderLesson(+lm[1])}
  else if(hs==='projects'){setNav('projects');renderProjects()}
  else if(hs==='play'){setNav('play');renderPlay()}
  else if(hs==='summary'){setNav('summary');renderSummary()}
  else{setNav('lessons');renderHome()}
  window.scrollTo(0,0);
}
$('#themeBtn').onclick=()=>{
  const root=document.documentElement;
  const cur=root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  root.dataset.theme=cur==='dark'?'light':'dark';
};
addEventListener('hashchange',route);
route();
