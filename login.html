
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | Gedo Academy</title>
<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg,#102a50,#1765a5);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  background: white;
  width: 100%;
  max-width: 420px;
  padding: 30px 24px;
  border-radius: 20px;
  box-shadow: 0 10px 35px #0003;
}
.logo {
  text-align: center;
  color: #1765a5;
  font-size: 27px;
  font-weight: bold;
}
.subtitle {
  text-align: center;
  color: #777;
  margin: 10px 0 25px;
}
.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 22px;
}
.tabs button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 9px;
  background: #edf2f8;
  color: #345;
  cursor: pointer;
  font-size: 15px;
}
.tabs button.active {
  background: #1765a5;
  color: white;
}
h2 {
  text-align: center;
  color: #17385e;
}
label {
  display: block;
  margin: 15px 0 7px;
  font-weight: bold;
  color: #34445a;
}
input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #d5dfeb;
  border-radius: 9px;
  outline: none;
  font-size: 15px;
  background: white;
}
input:focus, select:focus {
  border-color: #1765a5;
}
.main-btn {
  width: 100%;
  margin-top: 23px;
  padding: 14px;
  background: #1765a5;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 17px;
  cursor: pointer;
}
.main-btn:active {
  background: #102a50;
}
.hidden {
  display: none;
}
.note {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin-top: 20px;
  line-height: 1.7;
}
</style>
</head>
<body>

<div class="container">

  <div class="logo">🎓 GEDO ACADEMY</div>
  <p class="subtitle">بوابتك نحو مستقبل أفضل</p>

  <div class="tabs">
    <button id="loginTab" class="active"
      onclick="showForm('login')">تسجيل الدخول</button>
    <button id="registerTab"
      onclick="showForm('register')">حساب جديد</button>
  </div>

  <form id="loginForm">
    <h2>أهلاً بعودتك!</h2>

    <label>اسم المستخدم</label>
    <input type="text" id="loginUsername"
      placeholder="اكتب اسم المستخدم" required>

    <label>كلمة المرور</label>
    <input type="password" id="loginPassword"
      placeholder="اكتب كلمة المرور" required>

    <button class="main-btn" type="submit">
      تسجيل الدخول
    </button>
  </form>

  <form id="registerForm" class="hidden">
    <h2>إنشاء حساب طالب</h2>

    <label>الاسم الكامل</label>
    <input type="text" placeholder="اكتب اسمك الكامل" required>

    <label>اسم المستخدم</label>
    <input type="text" placeholder="اختر اسم مستخدم" required>

    <label>كلمة المرور</label>
    <input type="password" placeholder="اختر كلمة مرور" required>

    <label>المرحلة الدراسية</label>
    <select required>
      <option value="">اختر المرحلة</option>
      <option>ابتدائي</option>
      <option>إعدادي</option>
      <option>ثانوي</option>
    </select>

    <label>الصف الدراسي</label>
    <input type="text" placeholder="مثال: الصف الأول الإعدادي" required>

    <button class="main-btn" type="submit">
      إنشاء الحساب
    </button>
  </form>

  <p class="note">
    Gedo Academy<br>
    منصة تعليمية لجميع المراحل الدراسية
  </p>

</div>

<script>
function showForm(type) {
  const login = type === "login";

  document.getElementById("loginForm")
    .classList.toggle("hidden", !login);

  document.getElementById("registerForm")
    .classList.toggle("hidden", login);

  document.getElementById("loginTab")
    .classList.toggle("active", login);

  document.getElementById("registerTab")
    .classList.toggle("active", !login);
}

document.getElementById("loginForm")
  .addEventListener("submit", function(e) {
    e.preventDefault();
    alert("سيتم تفعيل تسجيل الدخول بعد ربط قاعدة البيانات.");
  });

document.getElementById("registerForm")
  .addEventListener("submit", function(e) {
    e.preventDefault();
    alert("سيتم تفعيل إنشاء الحساب بعد ربط قاعدة البيانات.");
  });
</script>

</body>
</html>
