<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEDO EXAMS</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b14;color:white;
 font-family:Arial,sans-serif;padding:15px
}
.container{max-width:800px;margin:auto}
header{text-align:center;padding:25px 5px}
h1{color:#38a9ff;font-size:34px;margin:5px}
.sub{color:#9baac0}
.card{
 background:#141d2e;border:1px solid #293954;
 border-radius:17px;padding:20px;margin:15px 0
}
input{
 width:100%;padding:14px;border-radius:10px;
 border:1px solid #52627a;background:#0b1220;
 color:white;font-size:16px
}
button{
 border:0;border-radius:10px;padding:13px 18px;
 background:#1688e8;color:white;font-size:16px;
 cursor:pointer;margin:5px
}
button:disabled{opacity:.35}
.option{
 display:block;width:100%;text-align:right;
 background:#202c40;color:white;
 border:2px solid #35445e;margin:10px 0;
 padding:15px;border-radius:12px
}
.option.selected{border-color:#38a9ff;background:#173653}
.info{color:#aebbd0;font-size:14px}
.bar{
 height:8px;background:#293954;
 border-radius:10px;overflow:hidden;margin:15px 0
}
#fill{height:100%;width:0;background:#38a9ff}
.hidden{display:none}
#review .correct{color:#35d68b}
#review .wrong{color:#ff6474}
</style>
</head>

<body>
<div class="container">

<header>
<h1>GEDO EXAMS</h1>
<div class="sub">نظام الامتحانات الإلكترونية</div>
<div class="info">اختبر مستواك وحقق أفضل نتيجة</div>
</header>

<div class="card" id="welcome">
<h2>أهلاً بك في الامتحان</h2>
<p>اكتب اسم الطالب للبدء:</p>
<input id="studentName" placeholder="اسم الطالب">
<br><br>
<button onclick="startExam()">ابدأ الامتحان</button>
</div>

<div class="card hidden" id="exam">
<div class="info" id="progress"></div>
<div class="bar"><div id="fill"></div></div>

<h3 id="subject"></h3>
<h2 id="question"></h2>

<div id="options"></div>

<div style="display:flex;justify-content:space-between;flex-wrap:wrap">
<button id="previous" onclick="move(-1)">السابق</button>
<button id="next" onclick="move(1)">التالي</button>
<button id="submit" onclick="submitExam()">تسليم الامتحان</button>
</div>
<p class="info" id="answered"></p>
</div>

<div class="card hidden" id="result">
<h2>انتهى الامتحان 🎉</h2>
<h3 id="resultName"></h3>
<h1 id="score"></h1>
<h2 id="percentage"></h2>
<div id="review"></div>
</div>

</div>

<script>
const questions = [
{
subject:"اللغة العربية - تجريبي",
q:"ما علامة رفع الفاعل المفرد؟",
a:["الضمة","الفتحة","الكسرة","السكون"],
correct:0,
explain:"الفاعل المفرد يُرفع بالضمة الظاهرة إذا كان صحيح الآخر."
},
{
subject:"اللغة الإنجليزية - تجريبي",
q:"Choose the correct form: She has ___ her homework.",
a:["finish","finished","finishing","finishes"],
correct:1,
explain:"المضارع التام يتكون من has أو have + التصريف الثالث للفعل."
},
{
subject:"الرياضيات - تجريبي",
q:"إذا كان 3س + 6 = 21، فما قيمة س؟",
a:["3","4","5","6"],
correct:2,
explain:"نطرح 6 من الطرفين فنحصل على 3س = 15، ثم نقسم على 3."
},
{
subject:"العلوم - تجريبي",
q:"ما الوحدة الأساسية لبناء الكائن الحي؟",
a:["النسيج","العضو","الخلية","الجهاز"],
correct:2,
explain:"الخلية هي الوحدة الأساسية في بناء الكائنات الحية."
},
{
subject:"الدراسات - تجريبي",
q:"ما المقصود بالموقع الجغرافي؟",
a:["مناخ المكان","موقع المكان بالنسبة للأماكن الأخرى","عدد السكان","مساحة المكان"],
correct:1,
explain:"الموقع الجغرافي يوضح موضع المكان بالنسبة لما يحيط به."
}
];

let current=0;
let answers=Array(questions.length).fill(null);
let student="";

function startExam(){
 student=document.getElementById("studentName").value.trim();
 if(!student){
  alert("اكتب اسم الطالب أولاً");
  return;
 }
 document.getElementById("welcome").classList.add("hidden");
 document.getElementById("exam").classList.remove("hidden");
 showQuestion();
}

function showQuestion(){
 let q=questions[current];
 document.getElementById("progress").textContent=
 "السؤال "+(current+1)+" من "+questions.length;

 document.getElementById("fill").style.width=
 ((current+1)/questions.length*100)+"%";

 document.getElementById("subject").textContent=q.subject;
 document.getElementById("question").textContent=q.q;

 let box=document.getElementById("options");
 box.innerHTML="";

 q.a.forEach((answer,i)=>{
  let b=document.createElement("button");
  b.className="option";
  b.textContent=answer;
  if(answers[current]===i)b.classList.add("selected");
  b.onclick=()=>{
   answers[current]=i;
   showQuestion();
  };
  box.appendChild(b);
 });

 document.getElementById("previous").disabled=current===0;
 document.getElementById("next").disabled=
 current===questions.length-1;

 let count=answers.filter(x=>x!==null).length;
 document.getElementById("answered").textContent=
 "تمت الإجابة عن "+count+" من "+questions.length+" أسئلة";
}

function move(direction){
 current+=direction;
 showQuestion();
}

function submitExam(){
 let unanswered=answers.filter(x=>x===null).length;
 if(unanswered>0){
  if(!confirm("لسه فيه "+unanswered+
  " سؤال بدون إجابة. هل تريد التسليم؟"))return;
 }else{
  if(!confirm("هل أنت متأكد من تسليم الامتحان؟"))return;
 }
 finishExam();
}

function finishExam(){
 let score=0;
 questions.forEach((q,i)=>{
  if(answers[i]===q.correct)score++;
 });

 document.getElementById("exam").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 document.getElementById("resultName").textContent=
 "الطالب: "+student;

 document.getElementById("score").textContent=
 "الدرجة: "+score+" / "+questions.length;

 document.getElementById("percentage").textContent=
 "النسبة: "+Math.round(score/questions.length*100)+"%";

 let review=document.getElementById("review");
 review.innerHTML="<h2>مراجعة الإجابات</h2>";

 questions.forEach((q,i)=>{
  let div=document.createElement("div");
  div.className="card";

  let title=document.createElement("h3");
  title.textContent="السؤال "+(i+1)+": "+q.q;
  div.appendChild(title);

  let your=document.createElement("p");
  your.className=answers[i]===q.correct?"correct":"wrong";
  your.textContent="إجابتك: "+
  (answers[i]===null?"لم تتم الإجابة":q.a[answers[i]]);
  div.appendChild(your);

  let right=document.createElement("p");
  right.className="correct";
  right.textContent="الإجابة الصحيحة: "+q.a[q.correct];
  div.appendChild(right);

  let explain=document.createElement("p");
  explain.textContent="التفسير: "+q.explain;
  div.appendChild(explain);

  review.appendChild(div);
 });
}
</script>
</body>
</html>
