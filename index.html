

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEDO EXAMS</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b14;color:white;
 font-family:Arial,sans-serif;padding:18px
}
.container{max-width:750px;margin:auto}
header{text-align:center;padding:25px 10px}
h1{color:#39a9ff;font-size:32px}
.sub{color:#aaa}
.card{
 background:#141b2b;border:1px solid #26334b;
 border-radius:16px;padding:20px;margin:15px 0
}
button{
 background:#1688e8;color:white;border:0;
 border-radius:10px;padding:13px 20px;
 font-size:16px;cursor:pointer;margin-top:12px
}
button:disabled{opacity:.5}
.option{
 display:block;width:100%;text-align:right;
 background:#202b40;color:white;
 border:2px solid #35445e;margin:10px 0;
 padding:15px;border-radius:12px
}
.option.correct{background:#124c35;border-color:#27d982}
.option.wrong{background:#57232c;border-color:#ff5968}
#feedback{font-weight:bold;margin-top:15px}
#next{display:none}
#result{text-align:center;font-size:22px}
.small{color:#aebbd0}
</style>
</head>
<body>
<div class="container">
<header>
<h1>GEDO EXAMS</h1>
<div class="sub">امتحان الصف الثالث الإعدادي 2027</div>
</header>

<div class="card" id="start">
<h2>أهلاً بك في الامتحان</h2>
<p>اختبر مستواك وأجب عن الأسئلة بعناية.</p>
<input id="student" placeholder="اكتب اسم الطالب"
style="width:100%;padding:14px;border-radius:9px">
<br>
<button onclick="begin()">ابدأ الامتحان</button>
</div>

<div class="card" id="exam" style="display:none">
<div class="small" id="progress"></div>
<h3 id="subject"></h3>
<h2 id="question"></h2>
<div id="options"></div>
<div id="feedback"></div>
<button id="next" onclick="nextQuestion()">السؤال التالي</button>
</div>

<div class="card" id="result" style="display:none">
<h2>انتهى الامتحان</h2>
<p id="studentResult"></p>
<p id="score"></p>
<p id="percent"></p>
</div>
</div>

<script>
const questions = [
{
subject:"اللغة الإنجليزية",
q:"Which sentence is in the present perfect?",
a:["I play football.","I have finished my homework.","I am playing now.","I played yesterday."],
correct:1
},
{
subject:"اللغة الإنجليزية",
q:"Choose the correct word: I have lived here ___ 2020.",
a:["for","since","ago","during"],
correct:1
},
{
subject:"اللغة الإنجليزية",
q:"If I had studied harder, I ___ the exam.",
a:["will pass","would pass","would have passed","pass"],
correct:2
},
{
subject:"اللغة العربية",
q:"ما علامة رفع الفاعل المفرد؟",
a:["الضمة","الفتحة","الكسرة","السكون"],
correct:0
},
{
subject:"اللغة العربية",
q:"أي الكلمات الآتية فعل؟",
a:["مدرسة","يكتب","كتاب","قلم"],
correct:1
},
{
subject:"الرياضيات",
q:"إذا كان س + 5 = 12، فإن قيمة س تساوي:",
a:["5","6","7","8"],
correct:2
}
];

let current=0,score=0,studentName="";

function begin(){
 studentName=document.getElementById("student").value.trim();
 if(!studentName){alert("اكتب اسم الطالب أولاً");return;}
 document.getElementById("start").style.display="none";
 document.getElementById("exam").style.display="block";
 showQuestion();
}

function showQuestion(){
 let q=questions[current];
 document.getElementById("progress").textContent=
 "السؤال "+(current+1)+" من "+questions.length;
 document.getElementById("subject").textContent=q.subject;
 document.getElementById("question").textContent=q.q;
 document.getElementById("feedback").textContent="";
 document.getElementById("next").style.display="none";
 let box=document.getElementById("options");
 box.innerHTML="";
 q.a.forEach((answer,i)=>{
  let b=document.createElement("button");
  b.className="option";
  b.textContent=answer;
  b.onclick=()=>choose(i);
  box.appendChild(b);
 });
}

function choose(choice){
 let q=questions[current];
 let buttons=document.querySelectorAll(".option");
 buttons.forEach((b,i)=>{
  b.disabled=true;
  if(i===q.correct)b.classList.add("correct");
  else if(i===choice)b.classList.add("wrong");
 });
 if(choice===q.correct){
  score++;
  document.getElementById("feedback").textContent="إجابة صحيحة! أحسنت";
  document.getElementById("feedback").style.color="#27d982";
 }else{
  document.getElementById("feedback").textContent=
  "إجابة غير صحيحة. الإجابة الصحيحة: "+q.a[q.correct];
  document.getElementById("feedback").style.color="#ff5968";
 }
 document.getElementById("next").style.display="inline-block";
}

function nextQuestion(){
 current++;
 if(current<questions.length)showQuestion();
 else finish();
}

function finish(){
 document.getElementById("exam").style.display="none";
 document.getElementById("result").style.display="block";
 document.getElementById("studentResult").textContent=
 "الطالب: "+studentName;
 document.getElementById("score").textContent=
 "درجتك: "+score+" من "+questions.length;
 document.getElementById("percent").textContent=
 "النسبة: "+Math.round(score/questions.length*100)+"%";
}
</script>
</body>
</html>
