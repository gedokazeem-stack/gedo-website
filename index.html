
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gedo Zlatan</title>
<style>
body {
  background: #080808;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 25px 12px;
}
h1 { color: gold; margin-top: 25px; }
img {
  width: 230px;
  max-width: 85%;
  border-radius: 20px;
  border: 3px solid gold;
  margin: 20px auto;
}
button {
  padding: 15px 35px;
  margin: 12px;
  border: none;
  border-radius: 12px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}
.yes { background: gold; color: black; }
.no { background: #333; color: white; }
#result {
  color: gold;
  font-size: 27px;
  font-weight: bold;
  margin-top: 25px;
}
</style>
</head>
<body>

<h1>🔥 إبراهيموفيتش عمك؟ 🔥</h1>

<img src="https://upload.wikimedia.org/wikipedia/commons/8/8b/Zlatan_Ibrahimovi%C4%87_June_2018.jpg"
alt="Zlatan Ibrahimovic">

<h2>اختار إجابتك يا بطل 😂</h2>

<button class="yes" onclick="answer(true)">أيوه 😎</button>
<button class="no" onclick="answer(false)">لأ 😂</button>

<div id="result"></div>

<script>
function answer(choice) {
  const result = document.getElementById("result");

  if (choice) {
    result.innerHTML = "🏆 كسبت! زلاتان عمك 👑";
  } else {
    result.innerHTML = " خلاص جدو عمك 👑";
  }
}
</script>

</body>
</html>
