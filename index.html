<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحذير أمني خطير</title>
<style>
body {
  background: #030303;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 20px;
}
h1 {
  color: #ff0000;
  font-size: 32px;
  text-shadow: 0 0 15px red;
}
.box {
  border: 2px solid red;
  border-radius: 15px;
  padding: 20px;
  margin-top: 25px;
  box-shadow: 0 0 20px red;
}
img {
  width: 100%;
  max-width: 280px;
  border-radius: 12px;
  margin: 15px auto;
}
.timer {
  color: red;
  font-size: 38px;
  direction: ltr;
  margin: 25px;
}
.warning {
  color: #ff3333;
  font-size: 21px;
  font-weight: bold;
}
.footer {
  color: #777;
  margin-top: 35px;
}
</style>
</head>
<body>

<h1>⚠ تحذير أمني خطير ⚠</h1>

<div class="box">

<h2>تم رصد تهديد إلكتروني!</h2>

<p class="warning">
بعد 12 ساعة موبيلاتكم هتخترق
</p>

<div class="timer" id="timer">12:00:00</div>

<h3>Gedo Zlatan Security System</h3>

<p>نظام محاكاة تحذير إلكتروني</p>

</div>

<div class="box">
<h2>Gedo Zlatan</h2>
<p>لاعب كرة القدم إبراهيموفيتش</p>
</div>

<div class="footer">
<p>هذا الموقع مقلب تمثيلي ولا ينفذ أي اختراق.</p>
</div>

<script>
let key = "friendsPrankEnd";
let end = localStorage.getItem(key);

if (!end) {
 end = Date.now() + 12 * 60 * 60 * 1000;
 localStorage.setItem(key, end);
}

function update() {
 let left = Math.max(0, end - Date.now());
 let h = Math.floor(left / 3600000);
 let m = Math.floor((left % 3600000) / 60000);
 let s = Math.floor((left % 60000) / 1000);

 document.getElementById("timer").textContent =
 [h,m,s].map(x => String(x).padStart(2,"0")).join(":");

 if(left === 0) {
  document.querySelector(".box").innerHTML =
  "<h2>انتهى المقلب!</h2><p>مفيش أي اختراق حصل.</p>";
 }
}
update();
setInterval(update,1000);
</script>

</body>
</html>
