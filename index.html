<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEDO EXAMS | امتحان الشهادة الإعدادية</title>
<style>
:root{--bg:#080b12;--panel:#111827;--panel2:#182235;--text:#f5f7fb;--muted:#aab4c5;--blue:#4f8cff;--green:#20c997;--red:#ff6577;--line:#29364b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17243a 0,#080b12 48%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{width:min(900px,94%);margin:25px auto}.brand{text-align:center;margin:24px 0}.brand h1{font-size:clamp(30px,7vw,48px);letter-spacing:2px;margin:0;color:#fff}.brand p{color:var(--muted);margin:8px 0}
.card{background:rgba(17,24,39,.96);border:1px solid var(--line);border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 12px 35px #0005}
input{width:100%;padding:14px;border-radius:11px;border:1px solid var(--line);background:#0b1220;color:white;font-size:17px;margin:10px 0}
button{border:0;border-radius:11px;padding:12px 18px;background:var(--blue);color:white;font-size:16px;font-weight:bold;cursor:pointer;margin:5px}
button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#26354c}.danger{background:#a83245}.success{background:#138765}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:var(--muted)}.hidden{display:none!important}
.progress{height:8px;background:#263247;border-radius:10px;overflow:hidden;margin:12px 0}.bar{height:100%;background:var(--green);width:0}
#subject{color:#9fc0ff;font-weight:bold}.qtext{font-size:21px;line-height:1.8;margin:18px 0}
.option{display:block;width:100%;text-align:right;background:#172338;border:1px solid #2d3d57;margin:10px 0;padding:14px;border-radius:12px;color:white;font-size:17px}
.option.selected{border:2px solid var(--blue);background:#1c355b}
.small{font-size:14px;color:var(--muted)}.review-item{border-top:1px solid var(--line);padding:15px 0;line-height:1.8}
.correct{color:#48dfad}.wrong{color:#ff8290}
@media(max-width:520px){.card{padding:15px}.qtext{font-size:18px}button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
<header class="brand"><h1>GEDO EXAMS</h1><p>امتحان تجريبي — الصف الثالث الإعدادي 2027</p></header>

<section id="start" class="card">
<h2>ابدأ امتحانك</h2>
<p class="muted">100 سؤال — 5 مواد — اختر إجابة واحدة لكل سؤال.</p>
<label for="student">اسم الطالب</label>
<input id="student" maxlength="40" placeholder="اكتب اسمك هنا">
<div class="row"><span class="small">اللغة العربية 25 • English 20 • الرياضيات 15 • العلوم 20 • الدراسات 20</span></div>
<button id="begin" class="success">ابدأ الامتحان</button>
</section>

<section id="exam" class="hidden">
<div class="card">
<div class="row"><strong id="studentLabel"></strong><span id="counter" class="muted"></span></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="row"><span id="subject"></span><span id="answered" class="small"></span></div>
<div id="question" class="qtext"></div>
<div id="options"></div>
<div class="row">
<button id="prev" class="secondary">السابق</button>
<button id="next">التالي</button>
<button id="submit" class="danger">إنهاء وتسليم</button>
</div>
</div>
</section>

<section id="result" class="hidden">
<div class="card">
<h2>نتيجة الامتحان</h2>
<p id="resultName"></p>
<h1 id="score"></h1>
<p id="percent" class="muted"></p>
<button id="showReview">مراجعة الإجابات</button>
<button onclick="location.reload()" class="secondary">امتحان جديد</button>
</div>
<div id="review" class="card hidden"><h2>مراجعة الأسئلة</h2><div id="reviewList"></div></div>
</section>
<footer class="small" style="text-align:center;padding:20px">GEDO EXAMS</footer>
</div>

const bank=[...arabicQuestions,...englishQuestions,...mathQuestions,...scienceQuestions,...socialQuestions];
let current=0,answers=Array(bank.length).fill(null),studentName="";
const $=id=>document.getElementById(id);
$("begin").onclick=()=>{
 studentName=$("student").value.trim();
 if(!studentName){alert("اكتب اسم الطالب أولًا");return;}
 $("start").classList.add("hidden");$("exam").classList.remove("hidden");$("studentLabel").textContent="الطالب: "+studentName;render();
};
function render(){
 const item=bank[current];$("counter").textContent=`السؤال ${current+1} من ${bank.length}`;
 $("bar").style.width=((current+1)/bank.length*100)+"%";$("subject").textContent=item.subject;
 $("answered").textContent=`تمت الإجابة عن ${answers.filter(x=>x!==null).length} سؤال`;
 $("question").textContent=item.question;$("options").innerHTML="";
 item.options.forEach((op,i)=>{const b=document.createElement("button");b.className="option"+(answers[current]===i?" selected":"");b.textContent=String.fromCharCode(65+i)+") "+op;b.onclick=()=>{answers[current]=i;render();};$("options").appendChild(b);});
 $("prev").disabled=current===0;$("next").disabled=current===bank.length-1;
}
$("prev").onclick=()=>{if(current>0){current--;render();}};
$("next").onclick=()=>{if(current<bank.length-1){current++;render();}};
$("submit").onclick=()=>{const unanswered=answers.filter(x=>x===null).length;if(!confirm(`هل تريد تسليم الامتحان؟ الأسئلة غير المجابة: ${unanswered}`))return;finish();};
function finish(){
 $("exam").classList.add("hidden");$("result").classList.remove("hidden");
 let score=0;bank.forEach((q,i)=>{if(answers[i]===q.answer)score++;});
 $("resultName").textContent="اسم الطالب: "+studentName;
 $("score").textContent=`${score} / ${bank.length}`;
 $("percent").textContent=`النسبة المئوية: ${Math.round(score/bank.length*100)}%`;
 $("showReview").onclick=()=>{const list=$("reviewList");list.innerHTML="";bank.forEach((q,i)=>{const d=document.createElement("div");d.className="review-item";const chosen=answers[i]===null?"لم تتم الإجابة":q.options[answers[i]];const good=q.options[q.answer];d.innerHTML=`<strong>${i+1}. ${q.subject}</strong><div>${escapeHTML(q.question)}</div><div class="${answers[i]===q.answer?"correct":"wrong"}">إجابتك: ${escapeHTML(chosen)}</div><div class="correct">الإجابة الصحيحة: ${escapeHTML(good)}</div><div class="small">التفسير: ${escapeHTML(q.explanation)}</div>`;list.appendChild(d);});$("review").classList.remove("hidden");$("review").scrollIntoView({behavior:"smooth"});};
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
