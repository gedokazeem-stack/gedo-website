
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جدو هاكر</title>

<style>
* {box-sizing:border-box}

body {
  margin:0;
  padding:20px 12px;
  background:#080000;
  color:#ff2222;
  font-family:Tahoma,Arial;
  text-align:center;
  animation:bg 1s infinite alternate;
}

@keyframes bg {
  from {background:#080000}
  to {background:#350000}
}

h1 {
  font-size:42px;
  text-shadow:0 0 20px red;
}

.warning {
  font-size:25px;
  font-weight:bold;
  animation:blink .5s infinite;
}

@keyframes blink {
  50% {opacity:.2}
}

.panel {
  border:2px solid red;
  border-radius:15px;
  padding:20px 10px;
  box-shadow:0 0 25px red;
  margin-top:20px;
}

#timer {
  font-size:60px;
  font-weight:bold;
  direction:ltr;
  text-shadow:0 0 20px red;
  margin:20px;
}

#messages {
  min-height:220px;
  text-align:right;
  line-height:2.3;
  color:#ff7777;
  overflow-wrap:anywhere;
}

.danger {
  color:red;
  font-size:25px;
  font-weight:bold;
  animation:blink .5s infinite;
}

#result {
  display:none;
  color:white;
  background:#a00000;
  padding:20px;
  border-radius:12px;
  font-size:22px;
  line-height:2;
}

.footer {
  margin-top:25px;
  padding:15px;
  border:1px solid red;
  color:#ffaaaa;
  font-size:14px;
}
</style>
</head>

<body>

<h1>جدو هاكر 😈</h1>

<div class="warning">
⚠️ تحذير! تحذير! ⚠️
</div>

<p>أنت الآن داخل محاكاة إلكترونية ترفيهية</p>

<div class="panel">

<div class="danger">خطر! خطر!</div>

<div id="timer">02:00</div>

<div id="messages">
جاري تجهيز المحاكاة...
</div>

<div id="result">
😂😂 اتخضيت؟<br>
جهازك سليم تماماً!<br>
كان مقلب من جدو هاكر ❤️
</div>

</div>

<div class="footer">
جدو عبدالله يقدم لك محاكاة هاكر ترفيهية فقط.
<br>
لا يوجد اختراق أو سرقة بيانات.
</div>

<script>
let seconds = 120;

let messages = [
"جاري تشغيل النظام الافتراضي...",
"⚠️ تحذير! جاري فحص البيئة التجريبية",
"جاري تحليل البيانات الوهمية...",
"خطر! خطر! جاري تحديث المحاكاة...",
"تم اكتشاف نشاط افتراضي...",
"جاري اختبار النظام...",
"تنبيه أحمر! استمر في مشاهدة المحاكاة",
"جاري معالجة البيانات التجريبية...",
"تم تشغيل نظام الحماية الافتراضي...",
"جاري تجهيز التقرير النهائي...",
"تحذير! المرحلة الأخيرة...",
"جاري إنهاء المحاكاة..."
];

let index = 0;

function addMessage() {
 let box = document.getElementById("messages");

 let line = document.createElement("div");
 line.textContent = messages[index % messages.length];

 box.prepend(line);
 index++;

 if(box.children.length > 9) {
   box.removeChild(box.lastChild);
 }
}

function start() {
 addMessage();

 let msgTimer = setInterval(addMessage, 3500);

 let countdown = setInterval(() => {
  seconds--;

  let min = Math.floor(seconds / 60);
  let sec = seconds % 60;

  document.getElementById("timer").textContent =
   String(min).padStart(2,"0") + ":" +
   String(sec).padStart(2,"0");

  if(seconds <= 0) {
   clearInterval(countdown);
   clearInterval(msgTimer);

   document.getElementById("messages").innerHTML =
   "انتهت جميع مراحل المحاكاة بنجاح!";

   document.getElementById("result").style.display =
   "block";
  }
 },1000);
}

start();
</script>

</body>
</html>
